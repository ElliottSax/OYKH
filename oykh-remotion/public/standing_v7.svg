<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9a825"/>
      <stop offset="50%" style="stop-color:#29b6f6"/>
      <stop offset="100%" style="stop-color:#ab47bc"/>
    </linearGradient>

    <!-- Clip paths for each body part -->
    <clipPath id="bodyHeadClip">
      <path d="M 960 377.5 C 1073.75 377.5 1073.75 526.25 1027.5 590 L 1030 640 Q 1030 677.5 960 677.5 Q 890 677.5 890 640 L 892.5 590 C 846.25 526.25 846.25 377.5 960 377.5 Z"/>
    </clipPath>

    <clipPath id="leftLegClip">
      <path d="M 946.44 646.51 Q 921.29 582.51 896.13 518.50 L 869.82 528.08 Q 891.69 593.28 913.56 658.49 Z"/>
    </clipPath>
    <clipPath id="leftFootClip">
      <ellipse cx="882.97" cy="523.29" rx="18.2" ry="15.4"/>
    </clipPath>

    <clipPath id="rightLegClip">
      <path d="M 1006.44 658.49 Q 1028.31 593.28 1050.18 528.08 L 1023.87 518.50 Q 998.71 582.51 973.56 646.51 Z"/>
    </clipPath>
    <clipPath id="rightFootClip">
      <ellipse cx="1037.03" cy="523.29" rx="18.2" ry="15.4"/>
    </clipPath>

    <clipPath id="leftArmClip">
      <path d="M 905.13 563.40 Q 851.25 546.99 797.88 529.16 L 790.69 548.89 Q 843.04 569.54 894.87 591.60 Z"/>
    </clipPath>
    <clipPath id="leftHandClip">
      <ellipse cx="794.28" cy="539.02" rx="12.6" ry="12.6"/>
    </clipPath>

    <clipPath id="rightArmClip">
      <path d="M 1025.13 591.60 Q 1076.96 569.54 1129.31 548.89 L 1122.12 529.16 Q 1068.75 546.99 1014.87 563.40 Z"/>
    </clipPath>
    <clipPath id="rightHandClip">
      <ellipse cx="1125.72" cy="539.02" rx="12.6" ry="12.6"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Ground shadow -->
  <ellipse cx="960" cy="852.5" rx="150" ry="37.5" fill="rgba(20,20,60,0.3)"/>

  <g id="character">

    <!-- ===================== LEFT LEG ===================== -->
    <g id="leftLeg">
      <!-- Base shape -->
      <path d="M 946.44 646.51 Q 921.29 582.51 896.13 518.50 L 869.82 528.08 Q 891.69 593.28 913.56 658.49 Z"
            fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10" stroke-linejoin="round"/>
      <ellipse cx="882.97" cy="523.29" rx="18.2" ry="15.4" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10"/>

      <!-- Shadow crescent (clipped inside) -->
      <g clip-path="url(#leftLegClip)">
        <ellipse cx="930" cy="585" rx="30" ry="60" fill="#D8DCE8" transform="rotate(-10 930 585)"/>
        <ellipse cx="918" cy="585" rx="28" ry="58" fill="#FFFFFF" transform="rotate(-10 918 585)"/>
      </g>

      <!-- Highlight crescent -->
      <g clip-path="url(#leftLegClip)">
        <ellipse cx="882" cy="570" rx="12" ry="35" fill="#FFFFFF" opacity="0.5" transform="rotate(-15 882 570)"/>
      </g>

      <!-- Foot shading -->
      <g clip-path="url(#leftFootClip)">
        <ellipse cx="892" cy="525" rx="14" ry="12" fill="#D8DCE8"/>
        <ellipse cx="887" cy="524" rx="12" ry="10" fill="#FFFFFF"/>
        <ellipse cx="876" cy="518" rx="5" ry="3" fill="#FFFFFF" opacity="0.6"/>
      </g>
    </g>

    <!-- ===================== RIGHT LEG ===================== -->
    <g id="rightLeg">
      <!-- Base shape -->
      <path d="M 1006.44 658.49 Q 1028.31 593.28 1050.18 528.08 L 1023.87 518.50 Q 998.71 582.51 973.56 646.51 Z"
            fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10" stroke-linejoin="round"/>
      <ellipse cx="1037.03" cy="523.29" rx="18.2" ry="15.4" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10"/>

      <!-- Shadow crescent -->
      <g clip-path="url(#rightLegClip)">
        <ellipse cx="1000" cy="585" rx="30" ry="60" fill="#D8DCE8" transform="rotate(10 1000 585)"/>
        <ellipse cx="988" cy="585" rx="28" ry="58" fill="#FFFFFF" transform="rotate(10 988 585)"/>
      </g>

      <!-- Highlight crescent -->
      <g clip-path="url(#rightLegClip)">
        <ellipse cx="992" cy="575" rx="12" ry="35" fill="#FFFFFF" opacity="0.5" transform="rotate(15 992 575)"/>
      </g>

      <!-- Foot shading -->
      <g clip-path="url(#rightFootClip)">
        <ellipse cx="1047" cy="525" rx="14" ry="12" fill="#D8DCE8"/>
        <ellipse cx="1042" cy="524" rx="12" ry="10" fill="#FFFFFF"/>
        <ellipse cx="1030" cy="518" rx="5" ry="3" fill="#FFFFFF" opacity="0.6"/>
      </g>
    </g>

    <!-- ===================== BODY + HEAD ===================== -->
    <g id="bodyHead">
      <!-- Base shape (connected head + torso) -->
      <path d="M 960 377.5 C 1073.75 377.5 1073.75 526.25 1027.5 590 L 1030 640 Q 1030 677.5 960 677.5 Q 890 677.5 890 640 L 892.5 590 C 846.25 526.25 846.25 377.5 960 377.5 Z"
            fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10" stroke-linejoin="round"/>

      <!-- HEAD: Shadow crescent (right side) -->
      <g clip-path="url(#bodyHeadClip)">
        <ellipse cx="1010" cy="450" rx="55" ry="70" fill="#D8DCE8"/>
        <ellipse cx="985" cy="448" rx="52" ry="68" fill="#FFFFFF"/>
      </g>

      <!-- HEAD: Primary highlight crescent (top-left arc) -->
      <g clip-path="url(#bodyHeadClip)">
        <ellipse cx="915" cy="415" rx="40" ry="50" fill="#FFFFFF"/>
        <ellipse cx="930" cy="430" rx="42" ry="52" fill="#FFFFFF" opacity="0"/>
      </g>

      <!-- HEAD: Specular highlight (small bright spot) -->
      <ellipse cx="912" cy="400" rx="14" ry="8" fill="#FFFFFF" opacity="0.8"
               transform="rotate(-30 912 400)" clip-path="url(#bodyHeadClip)"/>

      <!-- HEAD: Secondary small highlight -->
      <ellipse cx="925" cy="420" rx="6" ry="4" fill="#FFFFFF" opacity="0.5"
               transform="rotate(-20 925 420)" clip-path="url(#bodyHeadClip)"/>

      <!-- TORSO: Shadow crescent (right side) -->
      <g clip-path="url(#bodyHeadClip)">
        <ellipse cx="1012" cy="635" rx="40" ry="48" fill="#D8DCE8"/>
        <ellipse cx="992" cy="633" rx="38" ry="46" fill="#FFFFFF"/>
      </g>

      <!-- TORSO: Highlight crescent (left side) -->
      <ellipse cx="905" cy="620" rx="15" ry="28" fill="#FFFFFF" opacity="0.45"
               transform="rotate(-8 905 620)" clip-path="url(#bodyHeadClip)"/>

      <!-- Eyes -->
      <ellipse cx="930" cy="460" rx="12.5" ry="15" fill="#1a1a3e"/>
      <ellipse cx="990" cy="460" rx="12.5" ry="15" fill="#1a1a3e"/>

      <!-- Eye highlights (life in the eyes) -->
      <circle cx="925" cy="454" r="4" fill="#FFFFFF"/>
      <circle cx="985" cy="454" r="4" fill="#FFFFFF"/>
    </g>

    <!-- ===================== LEFT ARM ===================== -->
    <g id="leftArm">
      <!-- Base shape -->
      <path d="M 905.13 563.40 Q 851.25 546.99 797.88 529.16 L 790.69 548.89 Q 843.04 569.54 894.87 591.60 Z"
            fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10" stroke-linejoin="round"/>
      <ellipse cx="794.28" cy="539.02" rx="12.6" ry="12.6" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10"/>

      <!-- Arm shadow -->
      <g clip-path="url(#leftArmClip)">
        <ellipse cx="850" cy="572" rx="45" ry="14" fill="#D8DCE8" transform="rotate(-15 850 572)"/>
        <ellipse cx="850" cy="565" rx="43" ry="12" fill="#FFFFFF" transform="rotate(-15 850 565)"/>
      </g>

      <!-- Arm highlight -->
      <ellipse cx="855" cy="548" rx="25" ry="5" fill="#FFFFFF" opacity="0.5"
               transform="rotate(-15 855 548)" clip-path="url(#leftArmClip)"/>

      <!-- Hand shading -->
      <g clip-path="url(#leftHandClip)">
        <ellipse cx="800" cy="543" rx="10" ry="10" fill="#D8DCE8"/>
        <ellipse cx="796" cy="541" rx="8" ry="8" fill="#FFFFFF"/>
        <ellipse cx="788" cy="534" rx="4" ry="3" fill="#FFFFFF" opacity="0.7"/>
      </g>
    </g>

    <!-- ===================== RIGHT ARM ===================== -->
    <g id="rightArm">
      <!-- Base shape -->
      <path d="M 1025.13 591.60 Q 1076.96 569.54 1129.31 548.89 L 1122.12 529.16 Q 1068.75 546.99 1014.87 563.40 Z"
            fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10" stroke-linejoin="round"/>
      <ellipse cx="1125.72" cy="539.02" rx="12.6" ry="12.6" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10"/>

      <!-- Arm shadow -->
      <g clip-path="url(#rightArmClip)">
        <ellipse cx="1070" cy="572" rx="45" ry="14" fill="#D8DCE8" transform="rotate(15 1070 572)"/>
        <ellipse cx="1070" cy="565" rx="43" ry="12" fill="#FFFFFF" transform="rotate(15 1070 565)"/>
      </g>

      <!-- Arm highlight -->
      <ellipse cx="1065" cy="548" rx="25" ry="5" fill="#FFFFFF" opacity="0.5"
               transform="rotate(15 1065 548)" clip-path="url(#rightArmClip)"/>

      <!-- Hand shading -->
      <g clip-path="url(#rightHandClip)">
        <ellipse cx="1132" cy="543" rx="10" ry="10" fill="#D8DCE8"/>
        <ellipse cx="1128" cy="541" rx="8" ry="8" fill="#FFFFFF"/>
        <ellipse cx="1120" cy="534" rx="4" ry="3" fill="#FFFFFF" opacity="0.7"/>
      </g>
    </g>

  </g>
</svg>