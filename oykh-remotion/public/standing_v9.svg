<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!--
    Based on final_v122/standing.svg, scaled from 1024x1024 to 1920x1080.
    Scale factor: 1.875 (1920/1024)
    Y offset: (1080-1024*1.875)/2 = (1080-1920)/2 = -420 (need to center differently)

    Actually, let's scale to fit height: 1080/1024 = 1.0546875
    X offset to center: (1920 - 1024*1.0546875)/2 = (1920 - 1080)/2 = 420

    Scale = 1.0546875, X offset = 420, Y offset = 0
    -->

    <defs>
        <linearGradient id="goldenBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>

        <!-- CLIP PATHS - scaled and translated -->
        <clipPath id="leftLegClip">
            <path d="M 910.7 659.7 Q 935.0 665.9 935.0 678.0 C 932.1 711.0 928.9 739.2 926.1 772.1 C 922.6 812.2 913.1 846.2 909.6 886.3 Q 914.6 907.0 892.3 918.1 Q 870.0 907.0 875.0 883.4 C 878.5 843.1 875.1 808.1 878.6 767.9 C 881.5 734.9 883.2 706.6 886.2 673.6 Q 886.2 661.4 910.7 659.7 Z"/>
        </clipPath>
        <clipPath id="rightLegClip">
            <path d="M 1009.3 659.7 Q 1033.8 661.4 1033.8 673.6 C 1036.8 706.6 1038.5 734.9 1041.4 767.9 C 1044.9 808.1 1041.5 843.1 1045.0 883.4 Q 1050.0 907.0 1027.7 918.1 Q 1005.4 907.0 1010.4 886.3 C 1006.9 846.2 997.4 812.2 993.9 772.1 C 991.1 739.2 987.9 711.0 985.0 678.0 Q 985.0 665.9 1009.3 659.7 Z"/>
        </clipPath>
        <clipPath id="bodyClip">
            <path d="M 892.1 364.9
                Q 901.9 384.6
                  883.5 419.2
                Q 882.7 544.5
                  886.1 641.3
                Q 907.2 678.3
                  960.0 685.7
                Q 1012.8 678.3
                  1033.9 641.3
                Q 1037.3 544.5
                  1036.5 419.2
                Q 1018.1 384.6
                  1027.9 364.9
                Q 960.0 354.9
                  892.1 364.9
                Z"/>
        </clipPath>
        <clipPath id="leftArmClip">
            <path d="M 871.9 414.2
               C 865.7 437.4
                 839.4 546.5
                 833.1 569.7
               A 24.7 24.7 0 1 0 865.6 578.5
               C 871.9 555.2
                 903.7 447.6
                 910.0 424.4
               A 19.7 19.7 0 0 0 871.9 414.2
               Z"/>
        </clipPath>
        <clipPath id="rightArmClip">
            <path d="M 1048.1 414.2
               C 1054.3 437.4
                 1080.6 546.5
                 1086.9 569.7
               A 24.7 24.7 0 1 1 1054.4 578.5
               C 1048.1 555.2
                 1016.3 447.6
                 1010.0 424.4
               A 19.7 19.7 0 0 1 1048.1 414.2
               Z"/>
        </clipPath>
        <clipPath id="headClip">
            <circle cx="960.0" cy="277.6" r="128.4"/>
        </clipPath>

        <!-- MASKS -->
        <mask id="armMask">
            <rect x="0" y="0" width="2000" height="2000" fill="white"/>
            <path d="M 892.1 364.9
                Q 901.9 384.6
                  883.5 419.2
                Q 882.7 544.5
                  886.1 641.3
                Q 907.2 678.3
                  960.0 685.7
                Q 1012.8 678.3
                  1033.9 641.3
                Q 1037.3 544.5
                  1036.5 419.2
                Q 1018.1 384.6
                  1027.9 364.9
                Q 960.0 354.9
                  892.1 364.9
                Z" fill="black"/>
        </mask>
        <mask id="bodyOutlineMask">
            <rect x="0" y="0" width="2000" height="2000" fill="white"/>
            <path d="M 871.9 414.2
               C 865.7 437.4
                 839.4 546.5
                 833.1 569.7
               A 24.7 24.7 0 1 0 865.6 578.5
               C 871.9 555.2
                 903.7 447.6
                 910.0 424.4
               A 19.7 19.7 0 0 0 871.9 414.2
               Z" fill="black"/>
            <path d="M 1048.1 414.2
               C 1054.3 437.4
                 1080.6 546.5
                 1086.9 569.7
               A 24.7 24.7 0 1 1 1054.4 578.5
               C 1048.1 555.2
                 1016.3 447.6
                 1010.0 424.4
               A 19.7 19.7 0 0 1 1048.1 414.2
               Z" fill="black"/>
        </mask>

        <!-- FILTERS -->
        <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
            <feOffset dx="7" dy="12" result="shadow"/>
            <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
            <feComposite in2="shadow" operator="in"/>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
            <feFlood flood-color="#ffffff" flood-opacity="0.4"/>
            <feComposite in2="blur" operator="in" result="glow"/>
            <feMerge>
                <feMergeNode in="glow"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- GRADIENTS -->
        <linearGradient id="bodyGrad" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="40%" stop-color="#FAFAFA"/>
            <stop offset="75%" stop-color="#E8E8EE"/>
            <stop offset="100%" stop-color="#D8D8E2"/>
        </linearGradient>

        <radialGradient id="highlight" cx="70%" cy="25%" r="80%" fx="75%" fy="20%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="35%" stop-color="#FAFAFA"/>
            <stop offset="65%" stop-color="#ECECF2"/>
            <stop offset="100%" stop-color="#D8D8E2"/>
        </radialGradient>
    </defs>

    <!-- Background -->
    <rect width="1920" height="1080" fill="url(#goldenBg)"/>

    <!-- Ground Shadow -->
    <ellipse cx="960" cy="898" rx="153" ry="25" fill="rgba(30, 30, 50, 0.6)"/>

    <!-- CHARACTER GROUP with drop shadow -->
    <g id="character" filter="url(#dropShadow)">

        <!-- LEGS -->
        <path d="M 910.7 659.7 Q 935.0 665.9 935.0 678.0 C 932.1 711.0 928.9 739.2 926.1 772.1 C 922.6 812.2 913.1 846.2 909.6 886.3 Q 914.6 907.0 892.3 918.1 Q 870.0 907.0 875.0 883.4 C 878.5 843.1 875.1 808.1 878.6 767.9 C 881.5 734.9 883.2 706.6 886.2 673.6 Q 886.2 661.4 910.7 659.7 Z"
              fill="url(#bodyGrad)" stroke="#202038" stroke-width="13.6"
              stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M 1009.3 659.7 Q 1033.8 661.4 1033.8 673.6 C 1036.8 706.6 1038.5 734.9 1041.4 767.9 C 1044.9 808.1 1041.5 843.1 1045.0 883.4 Q 1050.0 907.0 1027.7 918.1 Q 1005.4 907.0 1010.4 886.3 C 1006.9 846.2 997.4 812.2 993.9 772.1 C 991.1 739.2 987.9 711.0 985.0 678.0 Q 985.0 665.9 1009.3 659.7 Z"
              fill="url(#bodyGrad)" stroke="#202038" stroke-width="13.6"
              stroke-linejoin="round" stroke-linecap="round"/>

        <!-- ARMS - fill only first -->
        <path d="M 871.9 414.2
           C 865.7 437.4
             839.4 546.5
             833.1 569.7
           A 24.7 24.7 0 1 0 865.6 578.5
           C 871.9 555.2
             903.7 447.6
             910.0 424.4
           A 19.7 19.7 0 0 0 871.9 414.2
           Z" fill="url(#bodyGrad)" stroke="none"/>
        <path d="M 1048.1 414.2
           C 1054.3 437.4
             1080.6 546.5
             1086.9 569.7
           A 24.7 24.7 0 1 1 1054.4 578.5
           C 1048.1 555.2
             1016.3 447.6
             1010.0 424.4
           A 19.7 19.7 0 0 1 1048.1 414.2
           Z" fill="url(#bodyGrad)" stroke="none"/>

        <!-- Arm outlines (masked where they overlap body) -->
        <g mask="url(#armMask)">
            <path d="M 871.9 414.2
               C 865.7 437.4
                 839.4 546.5
                 833.1 569.7
               A 24.7 24.7 0 1 0 865.6 578.5
               C 871.9 555.2
                 903.7 447.6
                 910.0 424.4
               A 19.7 19.7 0 0 0 871.9 414.2
               Z" fill="none" stroke="#202038" stroke-width="13.6"
                  stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M 1048.1 414.2
               C 1054.3 437.4
                 1080.6 546.5
                 1086.9 569.7
               A 24.7 24.7 0 1 1 1054.4 578.5
               C 1048.1 555.2
                 1016.3 447.6
                 1010.0 424.4
               A 19.7 19.7 0 0 1 1048.1 414.2
               Z" fill="none" stroke="#202038" stroke-width="13.6"
                  stroke-linejoin="round" stroke-linecap="round"/>
        </g>

        <!-- BODY -->
        <path d="M 892.1 364.9
            Q 901.9 384.6
              883.5 419.2
            Q 882.7 544.5
              886.1 641.3
            Q 907.2 678.3
              960.0 685.7
            Q 1012.8 678.3
              1033.9 641.3
            Q 1037.3 544.5
              1036.5 419.2
            Q 1018.1 384.6
              1027.9 364.9
            Q 960.0 354.9
              892.1 364.9
            Z" fill="url(#highlight)" stroke="none"/>

        <!-- Inner shadow at body-leg junction -->
        <ellipse cx="960" cy="666" rx="59" ry="20"
                 fill="#606080" opacity="0.08" clip-path="url(#bodyClip)"/>

        <!-- BODY outline (masked where arms overlap) -->
        <g mask="url(#bodyOutlineMask)">
            <path d="M 892.1 364.9
                Q 901.9 384.6
                  883.5 419.2
                Q 882.7 544.5
                  886.1 641.3
                Q 907.2 678.3
                  960.0 685.7
                Q 1012.8 678.3
                  1033.9 641.3
                Q 1037.3 544.5
                  1036.5 419.2
                Q 1018.1 384.6
                  1027.9 364.9
                Q 960.0 354.9
                  892.1 364.9
                Z" fill="none" stroke="#202038" stroke-width="13.6"
                  stroke-linejoin="round" stroke-linecap="round"/>
        </g>

        <!-- Body reflection stroke -->
        <path d="M 998 409
                 Q 1009 440
                   1003 471"
              stroke="#D0D0E0" stroke-width="17" fill="none"
              stroke-linecap="round" opacity="0.7"
              clip-path="url(#bodyClip)"/>

        <!-- HEAD -->
        <circle cx="960.0" cy="277.6" r="128.4"
                fill="url(#highlight)" stroke="#202038" stroke-width="13.6"/>

        <!-- Head reflection stroke -->
        <path d="M 973 185
                 A 100 100 0 0 1 1035 226"
              stroke="#D0D0E0" stroke-width="20" fill="none"
              stroke-linecap="round" opacity="0.75"
              clip-path="url(#headClip)"/>

        <!-- Eyes -->
        <ellipse cx="940" cy="277.6" rx="12.6" ry="16.3" fill="#202038"/>
        <ellipse cx="980" cy="277.6" rx="12.6" ry="16.3" fill="#202038"/>

        <!-- Eye highlights -->
        <circle cx="937.8" cy="272.4" r="3.7" fill="#FFFFFF" opacity="0.95"/>
        <circle cx="977.8" cy="272.4" r="3.7" fill="#FFFFFF" opacity="0.95"/>

    </g>
</svg>
