<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- v20: Fixes based on deep analysis -->
    <!-- 1. Same gradient for arms AND body (fixes armpit spikes) -->
    <!-- 2. Fewer leg curves with tangent continuity (fixes segmentation) -->
    <!-- 3. Larger, properly shaped feet -->

    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <g transform="translate(420, 0) scale(1.0546875)">

        <defs>
            <!-- MASKS -->
            <mask id="armMask">
                <rect x="0" y="0" width="2000" height="2000" fill="white"/>
                <path d="M 447.6 346.1
                    Q 456.9 364.8 439.4 397.6
                    Q 438.7 516.5 441.8 608.3
                    Q 461.8 643.4 512.0 650.4
                    Q 562.2 643.4 582.2 608.3
                    Q 585.3 516.5 584.6 397.6
                    Q 567.1 364.8 576.4 346.1
                    Q 512.0 336.7 447.6 346.1
                    Z" fill="black"/>
            </mask>
            <mask id="bodyOutlineMask">
                <rect x="0" y="0" width="2000" height="2000" fill="white"/>
                <!-- Left arm -->
                <path d="M 440 390
                   C 430 420 405 520 400 560
                   C 392 585 395 615 415 625
                   Q 430 630 445 620
                   C 455 605 450 575 445 555
                   C 450 510 465 420 470 395
                   Q 460 385 440 390
                   Z" fill="black"/>
                <!-- Right arm -->
                <path d="M 584 390
                   C 594 420 619 520 624 560
                   C 632 585 629 615 609 625
                   Q 594 630 579 620
                   C 569 605 574 575 579 555
                   C 574 510 559 420 554 395
                   Q 564 385 584 390
                   Z" fill="black"/>
            </mask>

            <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="9.36"/>
                <feOffset dx="7" dy="11.7" result="shadow"/>
                <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
                <feComposite in2="shadow" operator="in"/>
                <feMerge>
                    <feMergeNode/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <!-- SINGLE gradient for ALL body parts (fixes armpit spike) -->
            <radialGradient id="bodyFill" cx="65%" cy="20%" r="85%" fx="70%" fy="15%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="35%" stop-color="#FAFAFA"/>
                <stop offset="65%" stop-color="#F0F0F5"/>
                <stop offset="100%" stop-color="#E0E0E8"/>
            </radialGradient>

            <clipPath id="bodyClip">
                <path d="M 447.6 346.1
                    Q 456.9 364.8 439.4 397.6
                    Q 438.7 516.5 441.8 608.3
                    Q 461.8 643.4 512.0 650.4
                    Q 562.2 643.4 582.2 608.3
                    Q 585.3 516.5 584.6 397.6
                    Q 567.1 364.8 576.4 346.1
                    Q 512.0 336.7 447.6 346.1
                    Z"/>
            </clipPath>
            <clipPath id="headClip">
                <circle cx="512.0" cy="263.35" r="121.71"/>
            </clipPath>
        </defs>

        <!-- Ground Shadow -->
        <ellipse cx="512.0" cy="875" rx="150" ry="25" fill="rgba(30, 30, 50, 0.5)"/>

        <g filter="url(#dropShadow)">

            <!-- LEGS: Simplified paths (4 curves instead of 9), BIGGER FEET -->
            <!-- Left Leg -->
            <path d="M 462 625
                     C 485 630 490 660 488 720
                     C 486 780 475 830 460 865
                     Q 445 895 415 895
                     Q 390 890 400 860
                     C 415 820 430 760 435 700
                     C 440 650 445 630 462 625
                     Z"
                  fill="url(#bodyFill)" stroke="#202038" stroke-width="12.87"
                  stroke-linejoin="round" stroke-linecap="round"/>

            <!-- Right Leg -->
            <path d="M 562 625
                     C 539 630 534 660 536 720
                     C 538 780 549 830 564 865
                     Q 579 895 609 895
                     Q 634 890 624 860
                     C 609 820 594 760 589 700
                     C 584 650 579 630 562 625
                     Z"
                  fill="url(#bodyFill)" stroke="#202038" stroke-width="12.87"
                  stroke-linejoin="round" stroke-linecap="round"/>

            <!-- ARMS: Start INSIDE body, use SAME gradient as body -->
            <!-- Left Arm - starts at x=440 (inside body edge at x=439) -->
            <path d="M 440 390
                   C 430 420 405 520 400 560
                   C 392 585 395 615 415 625
                   Q 430 630 445 620
                   C 455 605 450 575 445 555
                   C 450 510 465 420 470 395
                   Q 460 385 440 390
                   Z" fill="url(#bodyFill)" stroke="none"/>

            <!-- Right Arm -->
            <path d="M 584 390
                   C 594 420 619 520 624 560
                   C 632 585 629 615 609 625
                   Q 594 630 579 620
                   C 569 605 574 575 579 555
                   C 574 510 559 420 554 395
                   Q 564 385 584 390
                   Z" fill="url(#bodyFill)" stroke="none"/>

            <!-- Arm outlines (masked by body) -->
            <g mask="url(#armMask)">
                <path d="M 440 390
                       C 430 420 405 520 400 560
                       C 392 585 395 615 415 625
                       Q 430 630 445 620
                       C 455 605 450 575 445 555
                       C 450 510 465 420 470 395
                       Q 460 385 440 390
                       Z" fill="none" stroke="#202038" stroke-width="12.87"
                      stroke-linejoin="round" stroke-linecap="round"/>
                <path d="M 584 390
                       C 594 420 619 520 624 560
                       C 632 585 629 615 609 625
                       Q 594 630 579 620
                       C 569 605 574 575 579 555
                       C 574 510 559 420 554 395
                       Q 564 385 584 390
                       Z" fill="none" stroke="#202038" stroke-width="12.87"
                      stroke-linejoin="round" stroke-linecap="round"/>
            </g>

            <!-- BODY -->
            <path d="M 447.6 346.1
                    Q 456.9 364.8 439.4 397.6
                    Q 438.7 516.5 441.8 608.3
                    Q 461.8 643.4 512.0 650.4
                    Q 562.2 643.4 582.2 608.3
                    Q 585.3 516.5 584.6 397.6
                    Q 567.1 364.8 576.4 346.1
                    Q 512.0 336.7 447.6 346.1
                    Z" fill="url(#bodyFill)" stroke="none"/>

            <ellipse cx="512.0" cy="631.66" rx="56.17" ry="18.72"
                     fill="#606080" opacity="0.08" clip-path="url(#bodyClip)"/>

            <g mask="url(#bodyOutlineMask)">
                <path d="M 447.6 346.1
                        Q 456.9 364.8 439.4 397.6
                        Q 438.7 516.5 441.8 608.3
                        Q 461.8 643.4 512.0 650.4
                        Q 562.2 643.4 582.2 608.3
                        Q 585.3 516.5 584.6 397.6
                        Q 567.1 364.8 576.4 346.1
                        Q 512.0 336.7 447.6 346.1
                        Z" fill="none" stroke="#202038" stroke-width="12.87"
                      stroke-linejoin="round" stroke-linecap="round"/>
            </g>

            <!-- Body reflection -->
            <path d="M 548 390 Q 560 430 553 470"
                  stroke="#E8E8F0" stroke-width="14" fill="none"
                  stroke-linecap="round" opacity="0.5"
                  clip-path="url(#bodyClip)"/>

            <!-- HEAD -->
            <circle cx="512.0" cy="263.35" r="121.71"
                    fill="url(#bodyFill)" stroke="#202038" stroke-width="12.87"/>

            <path d="M 530 180 A 90 90 0 0 1 590 230"
                  stroke="#E8E8F0" stroke-width="16" fill="none"
                  stroke-linecap="round" opacity="0.55"
                  clip-path="url(#headClip)"/>

            <!-- Eyes -->
            <ellipse cx="493.28" cy="263.35" rx="11.94" ry="15.45" fill="#202038"/>
            <ellipse cx="530.72" cy="263.35" rx="11.94" ry="15.45" fill="#202038"/>

            <circle cx="491.17" cy="258.43" r="3.51" fill="#FFFFFF" opacity="0.95"/>
            <circle cx="528.62" cy="258.43" r="3.51" fill="#FFFFFF" opacity="0.95"/>

        </g>
    </g>
</svg>
