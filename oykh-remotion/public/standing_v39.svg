<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- v39: TRUE unified shape based on v24 proportions + v30 legs
         - ONE continuous path for body+arms+legs (gingerbread man)
         - ONE exterior outline
         - Internal armpit detail lines
         - NO separate arm parts, NO masks needed -->

    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <g transform="translate(420, 0) scale(1.0546875)">

        <defs>
            <radialGradient id="bodyFill" cx="50%" cy="25%" r="75%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="50%" stop-color="#F5F5FA"/>
                <stop offset="100%" stop-color="#E8E8F0"/>
            </radialGradient>

            <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
                <feOffset dx="6" dy="10" result="shadow"/>
                <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
                <feComposite in2="shadow" operator="in"/>
                <feMerge>
                    <feMergeNode/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <clipPath id="headClip">
                <circle cx="512" cy="250" r="115"/>
            </clipPath>
        </defs>

        <!-- Ground Shadow -->
        <ellipse cx="512" cy="940" rx="180" ry="25" fill="rgba(30, 30, 50, 0.5)"/>

        <g filter="url(#dropShadow)">

            <!-- UNIFIED BODY + ARMS + LEGS - one continuous shape -->
            <!-- Path traces: neck -> left shoulder -> left arm exterior ->
                 left hand -> left arm interior -> left armpit ->
                 left torso -> left leg -> left foot -> crotch ->
                 right foot -> right leg -> right torso ->
                 right armpit -> right arm interior -> right hand ->
                 right arm exterior -> right shoulder -> neck -->
            <path d="
                M 480 365
                L 480 380
                Q 440 385 400 400
                C 370 420 345 500 338 560
                C 332 600 338 640 358 660
                Q 376 675 396 670
                Q 416 663 424 645
                C 430 620 426 585 420 555
                C 425 515 438 465 448 435
                L 440 480
                Q 432 540 435 600
                Q 440 660 430 720
                C 420 780 405 840 390 885
                Q 375 915 395 925
                L 455 930
                Q 480 925 485 900
                C 495 850 505 790 510 730
                L 512 700
                L 514 730
                C 519 790 529 850 539 900
                Q 544 925 569 930
                L 629 925
                Q 649 915 634 885
                C 619 840 604 780 594 720
                Q 584 660 589 600
                Q 592 540 584 480
                L 576 435
                C 586 465 599 515 604 555
                C 598 585 594 620 600 645
                Q 608 663 628 670
                Q 648 675 666 660
                C 686 640 692 600 686 560
                C 679 500 654 420 624 400
                Q 584 385 544 380
                L 544 365
                Q 512 355 480 365
                Z"
                  fill="url(#bodyFill)" stroke="#202038" stroke-width="12"
                  stroke-linejoin="round" stroke-linecap="round"/>

            <!-- Internal armpit detail lines (like reference images) -->
            <path d="M 448 435 Q 440 460 440 485"
                  fill="none" stroke="#202038" stroke-width="8"
                  stroke-linecap="round" opacity="0.5"/>
            <path d="M 576 435 Q 584 460 584 485"
                  fill="none" stroke="#202038" stroke-width="8"
                  stroke-linecap="round" opacity="0.5"/>

            <!-- HEAD -->
            <circle cx="512" cy="250" r="115"
                    fill="url(#bodyFill)" stroke="#202038" stroke-width="12"/>

            <!-- Head reflection -->
            <path d="M 545 155 A 85 85 0 0 1 600 210"
                  stroke="white" stroke-width="16" fill="none"
                  stroke-linecap="round" opacity="0.4"
                  clip-path="url(#headClip)"/>

            <!-- Eyes -->
            <ellipse cx="485" cy="255" rx="13" ry="16" fill="#202038"/>
            <ellipse cx="539" cy="255" rx="13" ry="16" fill="#202038"/>

            <!-- Eye highlights -->
            <circle cx="482" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>
            <circle cx="536" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>

        </g>
    </g>
</svg>
