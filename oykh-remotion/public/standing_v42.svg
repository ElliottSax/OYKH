<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- v42: Final fixes
         - Body FILL extends into head, body STROKE masked at head
         - Ken doll hands (smooth contour suggesting fingers)
         - Shoe-shaped feet from v30
         - No line between head and neck -->

    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <g transform="translate(420, 0) scale(1.0546875)">

        <defs>
            <radialGradient id="bodyFill" cx="50%" cy="25%" r="75%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="50%" stop-color="#F5F5FA"/>
                <stop offset="100%" stop-color="#E8E8F0"/>
            </radialGradient>

            <!-- Mask to hide body stroke inside head area -->
            <mask id="bodyStrokeMask">
                <rect x="0" y="0" width="2000" height="2000" fill="white"/>
                <circle cx="512" cy="250" r="121" fill="black"/>
            </mask>

            <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
                <feOffset dx="6" dy="10" result="shadow"/>
                <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
                <feComposite in2="shadow" operator="in"/>
                <feMerge>
                    <feMergeNode/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <clipPath id="headClip">
                <circle cx="512" cy="250" r="115"/>
            </clipPath>
        </defs>

        <!-- Ground Shadow -->
        <ellipse cx="512" cy="945" rx="180" ry="25" fill="rgba(30, 30, 50, 0.5)"/>

        <g filter="url(#dropShadow)">

            <!-- BODY FILL - extends up into head area for seamless connection -->
            <path d="
                M 480 340
                Q 512 335 544 340
                L 544 380
                Q 588 390 615 420
                C 640 448 665 515 672 565
                Q 680 610 665 645
                Q 652 670 632 675
                L 620 672
                Q 605 668 600 655
                C 592 635 595 605 600 575
                L 592 615
                Q 596 665 600 715
                C 604 765 610 815 615 860
                L 620 890
                L 625 905
                Q 630 925 610 935
                L 560 940
                Q 540 935 535 915
                L 530 890
                C 522 845 516 790 512 735
                L 512 705
                C 508 790 502 845 494 890
                L 489 915
                Q 484 935 464 940
                L 414 935
                Q 394 925 399 905
                L 404 890
                L 409 860
                C 414 815 420 765 424 715
                Q 428 665 432 615
                L 424 575
                C 429 605 432 635 424 655
                Q 419 668 404 672
                L 392 675
                Q 372 670 359 645
                Q 344 610 352 565
                C 359 515 384 448 409 420
                Q 436 390 480 380
                L 480 340
                Z"
                  fill="url(#bodyFill)" stroke="none"/>

            <!-- BODY STROKE - masked to hide inside head -->
            <g mask="url(#bodyStrokeMask)">
                <path d="
                    M 480 340
                    Q 512 335 544 340
                    L 544 380
                    Q 588 390 615 420
                    C 640 448 665 515 672 565
                    Q 680 610 665 645
                    Q 652 670 632 675
                    L 620 672
                    Q 605 668 600 655
                    C 592 635 595 605 600 575
                    L 592 615
                    Q 596 665 600 715
                    C 604 765 610 815 615 860
                    L 620 890
                    L 625 905
                    Q 630 925 610 935
                    L 560 940
                    Q 540 935 535 915
                    L 530 890
                    C 522 845 516 790 512 735
                    L 512 705
                    C 508 790 502 845 494 890
                    L 489 915
                    Q 484 935 464 940
                    L 414 935
                    Q 394 925 399 905
                    L 404 890
                    L 409 860
                    C 414 815 420 765 424 715
                    Q 428 665 432 615
                    L 424 575
                    C 429 605 432 635 424 655
                    Q 419 668 404 672
                    L 392 675
                    Q 372 670 359 645
                    Q 344 610 352 565
                    C 359 515 384 448 409 420
                    Q 436 390 480 380
                    L 480 340
                    Z"
                      fill="none" stroke="#202038" stroke-width="12"
                      stroke-linejoin="round" stroke-linecap="round"/>
            </g>

            <!-- Internal armpit detail lines -->
            <path d="M 424 575 Q 430 600 432 620"
                  fill="none" stroke="#202038" stroke-width="8"
                  stroke-linecap="round" opacity="0.5"/>
            <path d="M 600 575 Q 594 600 592 620"
                  fill="none" stroke="#202038" stroke-width="8"
                  stroke-linecap="round" opacity="0.5"/>

            <!-- HEAD - drawn on top -->
            <circle cx="512" cy="250" r="115"
                    fill="url(#bodyFill)" stroke="#202038" stroke-width="12"/>

            <!-- Head reflection -->
            <path d="M 545 155 A 85 85 0 0 1 600 210"
                  stroke="white" stroke-width="16" fill="none"
                  stroke-linecap="round" opacity="0.4"
                  clip-path="url(#headClip)"/>

            <!-- Eyes -->
            <ellipse cx="485" cy="255" rx="13" ry="16" fill="#202038"/>
            <ellipse cx="539" cy="255" rx="13" ry="16" fill="#202038"/>

            <!-- Eye highlights -->
            <circle cx="482" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>
            <circle cx="536" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>

        </g>
    </g>
</svg>
