<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- v12: Human proportions based on golden images -->
    <!-- Head ~120px, Body ~300px, Legs ~250px, Total ~670px -->
    <!-- Shoulders wider, waist narrower, hips medium -->
    <!-- Arms hang to hip level, tapered -->
    <!-- Legs have thigh/calf shape -->

    <defs>
        <linearGradient id="goldenBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>

        <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
            <feOffset dx="7" dy="12" result="shadow"/>
            <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
            <feComposite in2="shadow" operator="in"/>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <radialGradient id="highlight" cx="60%" cy="15%" r="90%" fx="65%" fy="12%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="30%" stop-color="#FAFAFA"/>
            <stop offset="60%" stop-color="#ECECF2"/>
            <stop offset="100%" stop-color="#D8D8E2"/>
        </radialGradient>

        <clipPath id="bodyClip">
            <use href="#character-shape"/>
        </clipPath>
    </defs>

    <!-- Background -->
    <rect width="1920" height="1080" fill="url(#goldenBg)"/>

    <!-- Ground Shadow -->
    <ellipse cx="960" cy="895" rx="130" ry="18" fill="rgba(30, 30, 50, 0.5)"/>

    <!-- CHARACTER with drop shadow -->
    <g id="character" filter="url(#dropShadow)">

        <!-- Human-proportioned silhouette -->
        <path id="character-shape" d="
            M 960 175

            C 1040 175, 1075 220, 1075 275
            C 1075 330, 1045 365, 1010 385

            Q 1055 390, 1085 400

            C 1100 405, 1115 420, 1125 445
            C 1140 480, 1150 520, 1150 555

            C 1155 575, 1150 590, 1135 595
            C 1120 600, 1105 595, 1095 580
            C 1085 565, 1080 545, 1085 525
            C 1080 505, 1070 490, 1055 485

            Q 1050 490, 1050 500

            C 1055 530, 1055 560, 1050 590

            Q 1055 610, 1050 630
            Q 1045 650, 1035 665

            C 1040 690, 1045 720, 1050 755
            C 1055 785, 1058 810, 1055 840
            C 1050 865, 1030 880, 1000 880

            C 985 882, 975 878, 975 860
            C 975 845, 978 825, 980 800
            C 982 775, 985 750, 985 725
            C 985 705, 982 690, 978 680

            Q 970 675, 960 675
            Q 950 675, 942 680

            C 938 690, 935 705, 935 725
            C 935 750, 938 775, 940 800
            C 942 825, 945 845, 945 860
            C 945 878, 935 882, 920 880

            C 890 880, 870 865, 865 840
            C 862 810, 865 785, 870 755
            C 875 720, 880 690, 885 665

            Q 875 650, 870 630
            Q 865 610, 870 590

            C 865 560, 865 530, 870 500

            Q 870 490, 865 485

            C 850 490, 840 505, 835 525
            C 840 545, 835 565, 825 580
            C 815 595, 800 600, 785 595
            C 770 590, 765 575, 770 555

            C 770 520, 780 480, 795 445
            C 805 420, 820 405, 835 400

            Q 865 390, 910 385

            C 875 365, 845 330, 845 275
            C 845 220, 880 175, 960 175

            Z
        " fill="url(#highlight)" stroke="#202038" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- Head reflection arc -->
        <path d="M 995 205 A 50 50 0 0 1 1040 260"
              stroke="#D0D0E0" stroke-width="16" fill="none"
              stroke-linecap="round" opacity="0.7"
              clip-path="url(#bodyClip)"/>

        <!-- Body reflection stroke -->
        <path d="M 1015 440 Q 1022 480 1018 520"
              stroke="#D0D0E0" stroke-width="12" fill="none"
              stroke-linecap="round" opacity="0.6"
              clip-path="url(#bodyClip)"/>

        <!-- Eyes -->
        <ellipse cx="940" cy="280" rx="12" ry="16" fill="#202038"/>
        <ellipse cx="980" cy="280" rx="12" ry="16" fill="#202038"/>

        <!-- Eye highlights -->
        <circle cx="937" cy="274" r="4" fill="#FFFFFF" opacity="0.95"/>
        <circle cx="977" cy="274" r="4" fill="#FFFFFF" opacity="0.95"/>

    </g>
</svg>
