<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- v16: Fix shading, thinner arms, straighter legs, smoother curves -->

    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>

        <!-- Subtle body gradient - very soft highlight -->
        <radialGradient id="bodyFill" cx="70%" cy="20%" r="85%" fx="75%" fy="15%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="35%" stop-color="#FBFBFB"/>
            <stop offset="65%" stop-color="#F2F2F5"/>
            <stop offset="100%" stop-color="#E8E8ED"/>
        </radialGradient>

        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
            <feOffset dx="6" dy="10" result="shadow"/>
            <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
            <feComposite in2="shadow" operator="in"/>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Mask: body shape hides arm strokes at shoulder -->
        <mask id="armMask">
            <rect width="2000" height="2000" fill="white"/>
            <path d="M 960 350
                     Q 1050 350, 1065 420
                     Q 1075 520, 1055 590
                     Q 1010 630, 960 630
                     Q 910 630, 865 590
                     Q 845 520, 855 420
                     Q 870 350, 960 350
                     Z" fill="black"/>
        </mask>

        <!-- Mask: arm shapes hide body stroke at shoulder -->
        <mask id="bodyMask">
            <rect width="2000" height="2000" fill="white"/>
            <!-- Left arm - simpler path -->
            <path d="M 880 405
                     Q 850 450, 830 530
                     Q 815 600, 820 660
                     Q 835 700, 865 695
                     Q 890 685, 895 640
                     Q 905 570, 910 490
                     Q 915 430, 905 405
                     Z" fill="black"/>
            <!-- Right arm -->
            <path d="M 1040 405
                     Q 1070 450, 1090 530
                     Q 1105 600, 1100 660
                     Q 1085 700, 1055 695
                     Q 1030 685, 1025 640
                     Q 1015 570, 1010 490
                     Q 1005 430, 1015 405
                     Z" fill="black"/>
        </mask>

        <clipPath id="headClip">
            <circle cx="960" cy="250" r="92"/>
        </clipPath>
        <clipPath id="bodyClip">
            <path d="M 960 350
                     Q 1050 350, 1065 420
                     Q 1075 520, 1055 590
                     Q 1010 630, 960 630
                     Q 910 630, 865 590
                     Q 845 520, 855 420
                     Q 870 350, 960 350
                     Z"/>
        </clipPath>
    </defs>

    <!-- Background -->
    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <!-- Ground shadow -->
    <ellipse cx="960" cy="865" rx="130" ry="20" fill="rgba(30, 30, 50, 0.45)"/>

    <!-- CHARACTER -->
    <g id="character" filter="url(#shadow)">

        <!-- === LEGS (simple tapered tubes, behind body) === -->

        <!-- Left Leg -->
        <path d="M 930 615
                 Q 920 620, 912 660
                 Q 900 720, 895 780
                 Q 893 820, 905 850
                 Q 920 865, 940 860
                 Q 955 850, 955 820
                 Q 952 760, 950 700
                 Q 948 650, 950 620
                 Q 942 612, 930 615
                 Z"
              fill="url(#bodyFill)" stroke="#202038" stroke-width="13"
              stroke-linejoin="round" stroke-linecap="round"/>

        <!-- Right Leg -->
        <path d="M 990 615
                 Q 1000 620, 1008 660
                 Q 1020 720, 1025 780
                 Q 1027 820, 1015 850
                 Q 1000 865, 980 860
                 Q 965 850, 965 820
                 Q 968 760, 970 700
                 Q 972 650, 970 620
                 Q 978 612, 990 615
                 Z"
              fill="url(#bodyFill)" stroke="#202038" stroke-width="13"
              stroke-linejoin="round" stroke-linecap="round"/>

        <!-- === ARMS (thinner, simpler curves) === -->

        <!-- Left Arm FILL -->
        <path d="M 880 405
                 Q 850 450, 830 530
                 Q 815 600, 820 660
                 Q 835 700, 865 695
                 Q 890 685, 895 640
                 Q 905 570, 910 490
                 Q 915 430, 905 405
                 Z"
              fill="url(#bodyFill)" stroke="none"/>

        <!-- Right Arm FILL -->
        <path d="M 1040 405
                 Q 1070 450, 1090 530
                 Q 1105 600, 1100 660
                 Q 1085 700, 1055 695
                 Q 1030 685, 1025 640
                 Q 1015 570, 1010 490
                 Q 1005 430, 1015 405
                 Z"
              fill="url(#bodyFill)" stroke="none"/>

        <!-- Arm STROKES (masked at shoulder) -->
        <g mask="url(#armMask)">
            <path d="M 880 405
                     Q 850 450, 830 530
                     Q 815 600, 820 660
                     Q 835 700, 865 695
                     Q 890 685, 895 640
                     Q 905 570, 910 490
                     Q 915 430, 905 405
                     Z"
                  fill="none" stroke="#202038" stroke-width="13"
                  stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M 1040 405
                     Q 1070 450, 1090 530
                     Q 1105 600, 1100 660
                     Q 1085 700, 1055 695
                     Q 1030 685, 1025 640
                     Q 1015 570, 1010 490
                     Q 1005 430, 1015 405
                     Z"
                  fill="none" stroke="#202038" stroke-width="13"
                  stroke-linejoin="round" stroke-linecap="round"/>
        </g>

        <!-- === BODY (smooth bean shape) === -->

        <!-- Body FILL -->
        <path d="M 960 350
                 Q 1050 350, 1065 420
                 Q 1075 520, 1055 590
                 Q 1010 630, 960 630
                 Q 910 630, 865 590
                 Q 845 520, 855 420
                 Q 870 350, 960 350
                 Z"
              fill="url(#bodyFill)" stroke="none"/>

        <!-- Body STROKE (masked at shoulders) -->
        <g mask="url(#bodyMask)">
            <path d="M 960 350
                     Q 1050 350, 1065 420
                     Q 1075 520, 1055 590
                     Q 1010 630, 960 630
                     Q 910 630, 865 590
                     Q 845 520, 855 420
                     Q 870 350, 960 350
                     Z"
                  fill="none" stroke="#202038" stroke-width="13"
                  stroke-linejoin="round" stroke-linecap="round"/>
        </g>

        <!-- Body reflection -->
        <path d="M 1005 410 Q 1018 470 1012 530"
              stroke="#E8E8F0" stroke-width="12" fill="none"
              stroke-linecap="round" opacity="0.5"
              clip-path="url(#bodyClip)"/>

        <!-- === HEAD === -->

        <circle cx="960" cy="250" r="92"
                fill="url(#bodyFill)" stroke="#202038" stroke-width="13"/>

        <!-- Head reflection -->
        <path d="M 988 180 A 65 65 0 0 1 1030 225"
              stroke="#E8E8F0" stroke-width="14" fill="none"
              stroke-linecap="round" opacity="0.55"
              clip-path="url(#headClip)"/>

        <!-- === EYES === -->
        <ellipse cx="938" cy="255" rx="12" ry="15" fill="#202038"/>
        <ellipse cx="982" cy="255" rx="12" ry="15" fill="#202038"/>

        <!-- Eye highlights -->
        <circle cx="935" cy="250" r="3.5" fill="#FFFFFF" opacity="0.95"/>
        <circle cx="979" cy="250" r="3.5" fill="#FFFFFF" opacity="0.95"/>

    </g>
</svg>
