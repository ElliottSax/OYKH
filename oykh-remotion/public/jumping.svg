<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- Jumping pose - arms spread wide, ~68px thick like standing -->

    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <g transform="translate(420, -40) scale(1.0546875)">

        <defs>
            <radialGradient id="bodyFill" cx="50%" cy="25%" r="75%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="50%" stop-color="#F5F5FA"/>
                <stop offset="100%" stop-color="#E8E8F0"/>
            </radialGradient>

            <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
                <feOffset dx="6" dy="10" result="shadow"/>
                <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
                <feComposite in2="shadow" operator="in"/>
                <feMerge>
                    <feMergeNode/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <clipPath id="headClip">
                <circle cx="512" cy="250" r="115"/>
            </clipPath>
        </defs>

        <!-- Ground Shadow - smaller and further below -->
        <ellipse cx="512" cy="990" rx="100" ry="15" fill="rgba(30, 30, 50, 0.3)"/>

        <g filter="url(#dropShadow)">

            <!-- JUMPING - Arms spread at 45deg angles, ~68px thick -->
            <path d="
                M 482 365
                Q 512 355 542 365
                L 542 380
                Q 585 370 640 340
                C 705 305 770 265 825 230
                Q 855 212 875 225
                Q 890 245 872 270
                Q 835 315 775 360
                C 715 405 655 445 610 475
                Q 590 492 592 515
                L 595 540
                Q 600 620 605 710
                C 610 770 618 835 628 885
                Q 638 920 622 935
                L 569 940
                Q 544 935 539 910
                C 529 860 522 800 518 740
                L 516 710
                L 514 740
                C 510 800 503 860 493 910
                Q 488 935 463 940
                L 410 935
                Q 394 920 404 885
                C 414 835 422 770 428 710
                Q 432 620 437 540
                L 440 515
                Q 442 492 422 475
                C 377 445 317 405 257 360
                Q 197 315 160 270
                Q 142 245 157 225
                Q 177 212 207 230
                C 262 265 327 305 392 340
                Q 447 370 482 380
                L 482 365
                Z"
                  fill="url(#bodyFill)" stroke="#202038" stroke-width="12"
                  stroke-linejoin="round" stroke-linecap="round"/>

            <!-- HEAD -->
            <circle cx="512" cy="250" r="115"
                    fill="url(#bodyFill)" stroke="#202038" stroke-width="12"/>

            <!-- Head reflection -->
            <path d="M 535 155 A 85 85 0 0 1 590 210"
                  stroke="#D0D0D8" stroke-width="16" fill="none"
                  stroke-linecap="round" opacity="0.5"
                  clip-path="url(#headClip)"/>

            <!-- Eyes - excited -->
            <ellipse cx="485" cy="255" rx="14" ry="17" fill="#202038"/>
            <ellipse cx="539" cy="255" rx="14" ry="17" fill="#202038"/>

            <!-- Eye highlights -->
            <circle cx="482" cy="250" r="5" fill="#FFFFFF" opacity="0.95"/>
            <circle cx="536" cy="250" r="5" fill="#FFFFFF" opacity="0.95"/>

        </g>
    </g>
</svg>
