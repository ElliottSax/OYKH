<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- v21: Fix gradient with userSpaceOnUse, mask leg strokes at hip -->

    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <g transform="translate(420, 0) scale(1.0546875)">

        <defs>
            <!-- GRADIENT with userSpaceOnUse - ABSOLUTE coordinates -->
            <!-- Centered on character (512, 400), so ALL shapes share same highlight -->
            <radialGradient id="bodyFill" gradientUnits="userSpaceOnUse"
                            cx="560" cy="300" r="500" fx="580" fy="280">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="30%" stop-color="#FAFAFA"/>
                <stop offset="60%" stop-color="#F0F0F5"/>
                <stop offset="100%" stop-color="#E0E0E8"/>
            </radialGradient>

            <!-- MASK: Hide leg strokes where they meet body -->
            <mask id="legMask">
                <rect x="0" y="0" width="2000" height="2000" fill="white"/>
                <!-- Body shape blocks leg strokes at hip -->
                <path d="M 447.6 346.1
                    Q 456.9 364.8 439.4 397.6
                    Q 438.7 516.5 441.8 608.3
                    Q 461.8 643.4 512.0 650.4
                    Q 562.2 643.4 582.2 608.3
                    Q 585.3 516.5 584.6 397.6
                    Q 567.1 364.8 576.4 346.1
                    Q 512.0 336.7 447.6 346.1
                    Z" fill="black"/>
            </mask>

            <!-- MASK: Hide arm strokes where they meet body -->
            <mask id="armMask">
                <rect x="0" y="0" width="2000" height="2000" fill="white"/>
                <path d="M 447.6 346.1
                    Q 456.9 364.8 439.4 397.6
                    Q 438.7 516.5 441.8 608.3
                    Q 461.8 643.4 512.0 650.4
                    Q 562.2 643.4 582.2 608.3
                    Q 585.3 516.5 584.6 397.6
                    Q 567.1 364.8 576.4 346.1
                    Q 512.0 336.7 447.6 346.1
                    Z" fill="black"/>
            </mask>

            <!-- MASK: Hide body strokes where arms overlap -->
            <mask id="bodyMask">
                <rect x="0" y="0" width="2000" height="2000" fill="white"/>
                <path d="M 440 390
                   C 430 420 405 520 400 560
                   C 392 585 395 615 415 625
                   Q 430 630 445 620
                   C 455 605 450 575 445 555
                   C 450 510 465 420 470 395
                   Q 460 385 440 390
                   Z" fill="black"/>
                <path d="M 584 390
                   C 594 420 619 520 624 560
                   C 632 585 629 615 609 625
                   Q 594 630 579 620
                   C 569 605 574 575 579 555
                   C 574 510 559 420 554 395
                   Q 564 385 584 390
                   Z" fill="black"/>
            </mask>

            <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
                <feOffset dx="6" dy="10" result="shadow"/>
                <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
                <feComposite in2="shadow" operator="in"/>
                <feMerge>
                    <feMergeNode/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <clipPath id="headClip">
                <circle cx="512.0" cy="263.35" r="121.71"/>
            </clipPath>
        </defs>

        <!-- Ground Shadow -->
        <ellipse cx="512.0" cy="880" rx="150" ry="22" fill="rgba(30, 30, 50, 0.5)"/>

        <g filter="url(#dropShadow)">

            <!-- LEGS: Fill only first -->
            <path d="M 462 625
                     C 485 630 490 660 488 720
                     C 486 780 475 830 460 865
                     Q 445 895 415 895
                     Q 390 890 400 860
                     C 415 820 430 760 435 700
                     C 440 650 445 630 462 625
                     Z" fill="url(#bodyFill)" stroke="none"/>
            <path d="M 562 625
                     C 539 630 534 660 536 720
                     C 538 780 549 830 564 865
                     Q 579 895 609 895
                     Q 634 890 624 860
                     C 609 820 594 760 589 700
                     C 584 650 579 630 562 625
                     Z" fill="url(#bodyFill)" stroke="none"/>

            <!-- LEG strokes (masked at hip) -->
            <g mask="url(#legMask)">
                <path d="M 462 625
                         C 485 630 490 660 488 720
                         C 486 780 475 830 460 865
                         Q 445 895 415 895
                         Q 390 890 400 860
                         C 415 820 430 760 435 700
                         C 440 650 445 630 462 625
                         Z" fill="none" stroke="#202038" stroke-width="12"
                      stroke-linejoin="round" stroke-linecap="round"/>
                <path d="M 562 625
                         C 539 630 534 660 536 720
                         C 538 780 549 830 564 865
                         Q 579 895 609 895
                         Q 634 890 624 860
                         C 609 820 594 760 589 700
                         C 584 650 579 630 562 625
                         Z" fill="none" stroke="#202038" stroke-width="12"
                      stroke-linejoin="round" stroke-linecap="round"/>
            </g>

            <!-- ARMS: Fill only -->
            <path d="M 440 390
                   C 430 420 405 520 400 560
                   C 392 585 395 615 415 625
                   Q 430 630 445 620
                   C 455 605 450 575 445 555
                   C 450 510 465 420 470 395
                   Q 460 385 440 390
                   Z" fill="url(#bodyFill)" stroke="none"/>
            <path d="M 584 390
                   C 594 420 619 520 624 560
                   C 632 585 629 615 609 625
                   Q 594 630 579 620
                   C 569 605 574 575 579 555
                   C 574 510 559 420 554 395
                   Q 564 385 584 390
                   Z" fill="url(#bodyFill)" stroke="none"/>

            <!-- ARM strokes (masked at shoulder) -->
            <g mask="url(#armMask)">
                <path d="M 440 390
                       C 430 420 405 520 400 560
                       C 392 585 395 615 415 625
                       Q 430 630 445 620
                       C 455 605 450 575 445 555
                       C 450 510 465 420 470 395
                       Q 460 385 440 390
                       Z" fill="none" stroke="#202038" stroke-width="12"
                      stroke-linejoin="round" stroke-linecap="round"/>
                <path d="M 584 390
                       C 594 420 619 520 624 560
                       C 632 585 629 615 609 625
                       Q 594 630 579 620
                       C 569 605 574 575 579 555
                       C 574 510 559 420 554 395
                       Q 564 385 584 390
                       Z" fill="none" stroke="#202038" stroke-width="12"
                      stroke-linejoin="round" stroke-linecap="round"/>
            </g>

            <!-- BODY: Fill only -->
            <path d="M 447.6 346.1
                    Q 456.9 364.8 439.4 397.6
                    Q 438.7 516.5 441.8 608.3
                    Q 461.8 643.4 512.0 650.4
                    Q 562.2 643.4 582.2 608.3
                    Q 585.3 516.5 584.6 397.6
                    Q 567.1 364.8 576.4 346.1
                    Q 512.0 336.7 447.6 346.1
                    Z" fill="url(#bodyFill)" stroke="none"/>

            <!-- BODY stroke (masked at shoulders) -->
            <g mask="url(#bodyMask)">
                <path d="M 447.6 346.1
                        Q 456.9 364.8 439.4 397.6
                        Q 438.7 516.5 441.8 608.3
                        Q 461.8 643.4 512.0 650.4
                        Q 562.2 643.4 582.2 608.3
                        Q 585.3 516.5 584.6 397.6
                        Q 567.1 364.8 576.4 346.1
                        Q 512.0 336.7 447.6 346.1
                        Z" fill="none" stroke="#202038" stroke-width="12"
                      stroke-linejoin="round" stroke-linecap="round"/>
            </g>

            <!-- HEAD -->
            <circle cx="512.0" cy="263.35" r="121.71"
                    fill="url(#bodyFill)" stroke="#202038" stroke-width="12"/>

            <!-- Head reflection -->
            <path d="M 535 185 A 85 85 0 0 1 590 235"
                  stroke="#F0F0F5" stroke-width="14" fill="none"
                  stroke-linecap="round" opacity="0.5"
                  clip-path="url(#headClip)"/>

            <!-- Eyes -->
            <ellipse cx="493" cy="265" rx="12" ry="15" fill="#202038"/>
            <ellipse cx="531" cy="265" rx="12" ry="15" fill="#202038"/>

            <!-- Eye highlights -->
            <circle cx="490" cy="260" r="3.5" fill="#FFFFFF" opacity="0.95"/>
            <circle cx="528" cy="260" r="3.5" fill="#FFFFFF" opacity="0.95"/>

        </g>
    </g>
</svg>
