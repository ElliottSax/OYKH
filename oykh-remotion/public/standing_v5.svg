  <!-- Ground shadow -->
  <ellipse cx="960" cy="852.5" rx="150" ry="37.5" fill="rgba(20,20,60,0.3)"/>

  <!-- CHARACTER -->
  <g id="character">

    <!-- ===== LEFT LEG ===== -->
    <g id="leftLeg">
      <path d="M 946.44 646.51 Q 921.29 582.51 896.13 518.50 L 869.82 528.08 Q 891.69 593.28 913.56 658.49 Z"
