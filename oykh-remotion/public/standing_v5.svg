      <g clip-path="url(#leftHandClip)">
        <ellipse cx="800" cy="542" rx="10" ry="10" fill="#D8DCE8"/>
        <ellipse cx="796" cy="540" rx="8" ry="8" fill="#FFFFFF"/>
      </g>
      <!-- Hand highlight -->
      <ellipse cx="788" cy="533" rx="4" ry="3" fill="#FFFFFF" opacity="0.6" clip-path="url(#leftHandClip)"/>
    </g>

    <!-- ===== RIGHT ARM ===== -->
    <g id="rightArm">
      <path d="M 1025.13 591.60 Q 1076.96 569.54 1129.31 548.89 L 1122.12 529.16 Q 1068.75 546.99 1014.87 563.40 Z"
            fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10" stroke-linejoin="round"/>
      <ellipse cx="1125.72" cy="539.02" rx="12.6" ry="12.6" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10"/>

      <!-- Arm shadow -->
      <g clip-path="url(#rightArmClip)">
        <ellipse cx="1075" cy="565" rx="50" ry="18" fill="#D8DCE8" transform="rotate(12 1075 565)"/>
        <ellipse cx="1075" cy="558" rx="48" ry="15" fill="#FFFFFF" transform="rotate(12 1075 558)"/>
      </g>
      <!-- Arm highlight -->
      <ellipse cx="1070" cy="545" rx="30" ry="6" fill="#FFFFFF" opacity="0.5" transform="rotate(12 1070 545)" clip-path="url(#rightArmClip)"/>

      <!-- Hand shadow -->
      <g clip-path="url(#rightHandClip)">
        <ellipse cx="1132" cy="542" rx="10" ry="10" fill="#D8DCE8"/>
        <ellipse cx="1128" cy="540" rx="8" ry="8" fill="#FFFFFF"/>
      </g>
      <!-- Hand highlight -->
      <ellipse cx="1120" cy="533" rx="4" ry="3" fill="#FFFFFF" opacity="0.6" clip-path="url(#rightHandClip)"/>
    </g>

