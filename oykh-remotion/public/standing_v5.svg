      <ellipse cx="882.97" cy="523.29" rx="18.2" ry="15.4" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10"/>

      <!-- Shadow crescent (two overlapping ellipses technique) -->
      <g clip-path="url(#leftLegClip)">
        <ellipse cx="925" cy="580" rx="35" ry="70" fill="#D8DCE8"/>
        <ellipse cx="912" cy="580" rx="30" ry="65" fill="#FFFFFF"/>
      </g>
      <!-- Foot shadow -->
      <g clip-path="url(#leftFootClip)">
        <ellipse cx="890" cy="523" rx="15" ry="12" fill="#D8DCE8"/>
        <ellipse cx="885" cy="523" rx="12" ry="10" fill="#FFFFFF"/>
