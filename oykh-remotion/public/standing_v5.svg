        <ellipse cx="935" cy="435" rx="48" ry="58" fill="none" stroke="#FFFFFF" stroke-width="0"/>
      </g>
      <ellipse cx="918" cy="408" rx="18" ry="10" fill="#FFFFFF" opacity="0.7" transform="rotate(-25 918 408)" clip-path="url(#bodyHeadClip)"/>
      <ellipse cx="928" cy="425" rx="8" ry="5" fill="#FFFFFF" opacity="0.5" transform="rotate(-20 928 425)" clip-path="url(#bodyHeadClip)"/>

      <!-- TORSO shadow crescent -->
      <g clip-path="url(#bodyHeadClip)">
        <ellipse cx="1010" cy="630" rx="50" ry="55" fill="#D8DCE8"/>
        <ellipse cx="990" cy="630" rx="45" ry="50" fill="#FFFFFF"/>
      </g>

      <!-- TORSO highlight -->
      <ellipse cx="908" cy="620" rx="12" ry="20" fill="#FFFFFF" opacity="0.4" transform="rotate(-10 908 620)" clip-path="url(#bodyHeadClip)"/>

      <!-- Eyes -->
      <ellipse cx="930" cy="460" rx="12.5" ry="15" fill="#1a1a3e"/>
      <ellipse cx="990" cy="460" rx="12.5" ry="15" fill="#1a1a3e"/>
      <!-- Eye highlights -->
      <circle cx="926" cy="455" r="4" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="986" cy="455" r="4" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- ===== LEFT ARM ===== -->
    <g id="leftArm">
      <path d="M 905.13 563.40 Q 851.25 546.99 797.88 529.16 L 790.69 548.89 Q 843.04 569.54 894.87 591.60 Z"
            fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10" stroke-linejoin="round"/>
      <ellipse cx="794.28" cy="539.02" rx="12.6" ry="12.6" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10"/>

      <!-- Arm shadow -->
      <g clip-path="url(#leftArmClip)">
        <ellipse cx="845" cy="565" rx="50" ry="18" fill="#D8DCE8" transform="rotate(-12 845 565)"/>
        <ellipse cx="845" cy="558" rx="48" ry="15" fill="#FFFFFF" transform="rotate(-12 845 558)"/>
      </g>
      <!-- Arm highlight -->
      <ellipse cx="850" cy="545" rx="30" ry="6" fill="#FFFFFF" opacity="0.5" transform="rotate(-12 850 545)" clip-path="url(#leftArmClip)"/>

