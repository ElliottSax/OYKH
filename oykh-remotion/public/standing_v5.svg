<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9a825"/>
      <stop offset="50%" style="stop-color:#29b6f6"/>
      <stop offset="100%" style="stop-color:#ab47bc"/>
    </linearGradient>

    <!-- CLIP PATHS - exact shapes from original -->
    <clipPath id="bodyHeadClip">
      <path d="M 960 377.5 C 1073.75 377.5 1073.75 526.25 1027.5 590 L 1030 640 Q 1030 677.5 960 677.5 Q 890 677.5 890 640 L 892.5 590 C 846.25 526.25 846.25 377.5 960 377.5 Z"/>
    </clipPath>
    <clipPath id="leftLegClip">
      <path d="M 946.44 646.51 Q 921.29 582.51 896.13 518.50 L 869.82 528.08 Q 891.69 593.28 913.56 658.49 Z"/>
      <ellipse cx="882.97" cy="523.29" rx="18.2" ry="15.4"/>
    </clipPath>
    <clipPath id="rightLegClip">
      <path d="M 1006.44 658.49 Q 1028.31 593.28 1050.18 528.08 L 1023.87 518.50 Q 998.71 582.51 973.56 646.51 Z"/>
      <ellipse cx="1037.03" cy="523.29" rx="18.2" ry="15.4"/>
    </clipPath>
    <clipPath id="leftArmClip">
      <path d="M 905.13 563.40 Q 851.25 546.99 797.88 529.16 L 790.69 548.89 Q 843.04 569.54 894.87 591.60 Z"/>
      <ellipse cx="794.28" cy="539.02" rx="12.6" ry="12.6"/>
    </clipPath>
    <clipPath id="rightArmClip">
      <path d="M 1025.13 591.60 Q 1076.96 569.54 1129.31 548.89 L 1122.12 529.16 Q 1068.75 546.99 1014.87 563.40 Z"/>
      <ellipse cx="1125.72" cy="539.02" rx="12.6" ry="12.6"/>
    </clipPath>
    <clipPath id="leftHandClip">
      <ellipse cx="794.28" cy="539.02" rx="12.6" ry="12.6"/>
    </clipPath>
    <clipPath id="rightHandClip">
      <ellipse cx="1125.72" cy="539.02" rx="12.6" ry="12.6"/>
    </clipPath>
    <clipPath id="leftFootClip">
      <ellipse cx="882.97" cy="523.29" rx="18.2" ry="15.4"/>
    </clipPath>
    <clipPath id="rightFootClip">
      <ellipse cx="1037.03" cy="523.29" rx="18.2" ry="15.4"/>
