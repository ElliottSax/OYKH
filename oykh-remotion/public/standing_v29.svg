<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- v29: Minimal fixes from v28:
         1. Arms start higher to meet shoulder curve
         2. Sharper hands
         3. Rounder feet -->

    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <g transform="translate(420, 0) scale(1.0546875)">

        <defs>
            <radialGradient id="bodyFill" cx="50%" cy="25%" r="75%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="50%" stop-color="#F5F5FA"/>
                <stop offset="100%" stop-color="#E8E8F0"/>
            </radialGradient>

            <mask id="armMask">
                <rect x="0" y="0" width="2000" height="2000" fill="white"/>
                <ellipse cx="512" cy="520" rx="80" ry="155" fill="black"/>
            </mask>

            <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
                <feOffset dx="6" dy="10" result="shadow"/>
                <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
                <feComposite in2="shadow" operator="in"/>
                <feMerge>
                    <feMergeNode/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <clipPath id="headClip">
                <circle cx="512" cy="250" r="115"/>
            </clipPath>
        </defs>

        <!-- Ground Shadow -->
        <ellipse cx="512" cy="940" rx="200" ry="28" fill="rgba(30, 30, 50, 0.5)"/>

        <g filter="url(#dropShadow)">

            <!-- BODY - same as v28, with ROUNDER feet -->
            <path d="
                M 482 365
                L 482 380
                Q 405 392 400 425
                L 398 485
                Q 395 555 408 615
                Q 415 655 428 690
                C 420 740 405 810 388 870
                Q 358 920 330 935
                Q 310 950 340 960
                Q 400 970 460 955
                Q 490 940 498 900
                C 505 850 510 790 512 740
                L 512 720
                C 514 790 519 850 526 900
                Q 534 940 564 955
                Q 624 970 684 960
                Q 714 950 694 935
                Q 666 920 636 870
                C 619 810 604 740 596 690
                Q 609 655 616 615
                Q 629 555 626 485
                L 624 425
                Q 619 392 542 380
                L 542 365
                Q 512 355 482 365
                Z"
                  fill="url(#bodyFill)" stroke="#202038" stroke-width="12"
                  stroke-linejoin="round" stroke-linecap="round"/>

            <!-- LEFT ARM - starts at y=405 to meet shoulder, SHARPER hand -->
            <path d="M 402 405
                   C 370 435 340 530 330 595
                   C 325 630 330 660 350 680
                   L 380 695
                   L 405 680
                   C 420 660 415 630 408 595
                   C 418 540 450 450 462 415
                   Q 435 395 402 405
                   Z" fill="url(#bodyFill)" stroke="none"/>

            <!-- RIGHT ARM - starts at y=405 to meet shoulder, SHARPER hand -->
            <path d="M 622 405
                   C 654 435 684 530 694 595
                   C 699 630 694 660 674 680
                   L 644 695
                   L 619 680
                   C 604 660 609 630 616 595
                   C 606 540 574 450 562 415
                   Q 589 395 622 405
                   Z" fill="url(#bodyFill)" stroke="none"/>

            <!-- ARM strokes (masked by torso) -->
            <g mask="url(#armMask)">
                <path d="M 402 405
                       C 370 435 340 530 330 595
                       C 325 630 330 660 350 680
                       L 380 695
                       L 405 680
                       C 420 660 415 630 408 595
                       C 418 540 450 450 462 415
                       Q 435 395 402 405
                       Z" fill="none" stroke="#202038" stroke-width="12"
                      stroke-linejoin="round" stroke-linecap="round"/>
                <path d="M 622 405
                       C 654 435 684 530 694 595
                       C 699 630 694 660 674 680
                       L 644 695
                       L 619 680
                       C 604 660 609 630 616 595
                       C 606 540 574 450 562 415
                       Q 589 395 622 405
                       Z" fill="none" stroke="#202038" stroke-width="12"
                      stroke-linejoin="round" stroke-linecap="round"/>
            </g>

            <!-- HEAD -->
            <circle cx="512" cy="250" r="115"
                    fill="url(#bodyFill)" stroke="#202038" stroke-width="12"/>

            <!-- Head reflection -->
            <path d="M 545 155 A 85 85 0 0 1 600 210"
                  stroke="white" stroke-width="16" fill="none"
                  stroke-linecap="round" opacity="0.4"
                  clip-path="url(#headClip)"/>

            <!-- Eyes -->
            <ellipse cx="485" cy="255" rx="13" ry="16" fill="#202038"/>
            <ellipse cx="539" cy="255" rx="13" ry="16" fill="#202038"/>

            <!-- Eye highlights -->
            <circle cx="482" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>
            <circle cx="536" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>

        </g>
    </g>
</svg>
