<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- TRUE Gingerbread-man: ONE continuous path, no internal lines -->

    <defs>
        <linearGradient id="goldenBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>

        <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
            <feOffset dx="7" dy="12" result="shadow"/>
            <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
            <feComposite in2="shadow" operator="in"/>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <radialGradient id="highlight" cx="60%" cy="15%" r="90%" fx="65%" fy="12%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="30%" stop-color="#FAFAFA"/>
            <stop offset="60%" stop-color="#ECECF2"/>
            <stop offset="100%" stop-color="#D8D8E2"/>
        </radialGradient>

        <clipPath id="bodyClip">
            <use href="#gingerbread"/>
        </clipPath>
    </defs>

    <!-- Background -->
    <rect width="1920" height="1080" fill="url(#goldenBg)"/>

    <!-- Ground Shadow -->
    <ellipse cx="960" cy="910" rx="145" ry="20" fill="rgba(30, 30, 50, 0.5)"/>

    <!-- CHARACTER with drop shadow -->
    <g id="character" filter="url(#dropShadow)">

        <!-- ONE SINGLE PATH: Gingerbread man silhouette -->
        <!-- Clockwise from top of head: head -> right arm -> right hand -> back to body -> right leg -> right foot -> left foot -> left leg -> back to body -> left arm -> left hand -> back to head -->
        <path id="gingerbread" d="
            M 960 150

            C 1050 150, 1085 200, 1085 270
            C 1085 320, 1060 360, 1020 390

            C 1045 400, 1080 420, 1110 460
            C 1130 485, 1145 510, 1150 535

            C 1160 555, 1165 575, 1155 595
            C 1145 615, 1120 625, 1095 620
            C 1070 615, 1050 600, 1045 575
            C 1040 555, 1040 535, 1045 515

            C 1035 510, 1025 505, 1020 510

            C 1025 540, 1028 580, 1028 620
            C 1028 660, 1025 700, 1025 740
            C 1025 780, 1030 820, 1025 855

            C 1020 885, 1000 900, 970 900
            C 940 900, 925 890, 925 860
            C 925 840, 930 815, 935 785
            C 940 755, 942 720, 942 680

            C 942 665, 960 660, 960 660

            C 960 660, 978 665, 978 680
            C 978 720, 980 755, 985 785
            C 990 815, 995 840, 995 860
            C 995 890, 980 900, 950 900
            C 920 900, 900 885, 895 855
            C 890 820, 895 780, 895 740
            C 895 700, 892 660, 892 620
            C 892 580, 895 540, 900 510

            C 895 505, 885 510, 875 515

            C 880 535, 880 555, 875 575
            C 870 600, 850 615, 825 620
            C 800 625, 775 615, 765 595
            C 755 575, 760 555, 770 535
            C 775 510, 790 485, 810 460
            C 840 420, 875 400, 900 390

            C 860 360, 835 320, 835 270
            C 835 200, 870 150, 960 150

            Z
        " fill="url(#highlight)" stroke="#202038" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- Head reflection arc -->
        <path d="M 995 185 A 55 55 0 0 1 1045 245"
              stroke="#D0D0E0" stroke-width="16" fill="none"
              stroke-linecap="round" opacity="0.7"
              clip-path="url(#bodyClip)"/>

        <!-- Body reflection stroke -->
        <path d="M 1000 440 Q 1008 480 1002 520"
              stroke="#D0D0E0" stroke-width="12" fill="none"
              stroke-linecap="round" opacity="0.6"
              clip-path="url(#bodyClip)"/>

        <!-- Eyes -->
        <ellipse cx="935" cy="280" rx="14" ry="18" fill="#202038"/>
        <ellipse cx="985" cy="280" rx="14" ry="18" fill="#202038"/>

        <!-- Eye highlights -->
        <circle cx="931" cy="273" r="4.5" fill="#FFFFFF" opacity="0.95"/>
        <circle cx="981" cy="273" r="4.5" fill="#FFFFFF" opacity="0.95"/>

    </g>
</svg>
