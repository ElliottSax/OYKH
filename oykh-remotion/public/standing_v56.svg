<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- v56: Based on v55
         - Arms thickened by ~50px
         - Even thickness throughout -->

    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <g transform="translate(420, 0) scale(1.0546875)">

        <defs>
            <radialGradient id="bodyFill" cx="50%" cy="25%" r="75%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="50%" stop-color="#F5F5FA"/>
                <stop offset="100%" stop-color="#E8E8F0"/>
            </radialGradient>

            <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
                <feOffset dx="6" dy="10" result="shadow"/>
                <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
                <feComposite in2="shadow" operator="in"/>
                <feMerge>
                    <feMergeNode/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <clipPath id="headClip">
                <circle cx="512" cy="250" r="115"/>
            </clipPath>
        </defs>

        <!-- Ground Shadow -->
        <ellipse cx="512" cy="940" rx="180" ry="25" fill="rgba(30, 30, 50, 0.5)"/>

        <g filter="url(#dropShadow)">

            <!-- CHALK OUTLINE - much thicker arms (+50px), even thickness -->
            <path d="
                M 482 365
                Q 512 355 542 365
                L 542 380
                Q 590 390 660 410
                C 700 430 755 490 770 560
                L 775 615
                Q 778 650 774 680
                Q 770 705 748 715
                Q 726 725 706 712
                Q 688 700 690 670
                L 695 635
                L 700 595
                C 702 560 698 525 688 495
                L 625 470
                Q 600 575 605 695
                C 610 755 618 820 628 870
                Q 638 905 622 920
                L 567 925
                Q 542 920 537 895
                C 527 845 520 785 516 725
                L 512 695
                L 508 725
                C 504 785 497 845 487 895
                Q 482 920 457 925
                L 402 920
                Q 386 905 396 870
                C 406 820 414 755 419 695
                Q 424 575 399 470
                L 336 495
                C 326 525 322 560 324 595
                L 329 635
                L 334 670
                Q 336 700 318 712
                Q 298 725 276 715
                Q 254 705 250 680
                Q 246 650 249 615
                L 254 560
                C 269 490 324 430 364 410
                Q 434 390 482 380
                L 482 365
                Z"
                  fill="url(#bodyFill)" stroke="#202038" stroke-width="12"
                  stroke-linejoin="round" stroke-linecap="round"/>

            <!-- HEAD -->
            <circle cx="512" cy="250" r="115"
                    fill="url(#bodyFill)" stroke="#202038" stroke-width="12"/>

            <!-- Head reflection - LIGHT GRAY -->
            <path d="M 535 155 A 85 85 0 0 1 590 210"
                  stroke="#D0D0D8" stroke-width="16" fill="none"
                  stroke-linecap="round" opacity="0.5"
                  clip-path="url(#headClip)"/>

            <!-- Eyes -->
            <ellipse cx="485" cy="255" rx="13" ry="16" fill="#202038"/>
            <ellipse cx="539" cy="255" rx="13" ry="16" fill="#202038"/>

            <!-- Eye highlights -->
            <circle cx="482" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>
            <circle cx="536" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>

        </g>
    </g>
</svg>
