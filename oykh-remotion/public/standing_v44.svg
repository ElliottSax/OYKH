<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- v44: Chalk outline hands and feet
         - HAND: wrist -> palm -> fingers (group) -> thumb bump -> back
         - FOOT: heel -> arch -> ball -> toes (rounded) -->

    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <g transform="translate(420, 0) scale(1.0546875)">

        <defs>
            <radialGradient id="bodyFill" cx="50%" cy="25%" r="75%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="50%" stop-color="#F5F5FA"/>
                <stop offset="100%" stop-color="#E8E8F0"/>
            </radialGradient>

            <mask id="bodyStrokeMask">
                <rect x="0" y="0" width="2000" height="2000" fill="white"/>
                <circle cx="512" cy="250" r="121" fill="black"/>
            </mask>

            <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
                <feOffset dx="6" dy="10" result="shadow"/>
                <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
                <feComposite in2="shadow" operator="in"/>
                <feMerge>
                    <feMergeNode/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <clipPath id="headClip">
                <circle cx="512" cy="250" r="115"/>
            </clipPath>
        </defs>

        <!-- Ground Shadow -->
        <ellipse cx="512" cy="945" rx="180" ry="25" fill="rgba(30, 30, 50, 0.5)"/>

        <g filter="url(#dropShadow)">

            <!-- BODY with chalk outline HANDS and FEET -->
            <path d="
                M 480 340
                Q 512 335 544 340
                L 544 380
                Q 588 390 615 420
                C 638 448 658 505 665 555
                C 670 590 668 625 655 650
                L 648 665
                L 655 680
                Q 660 695 650 705
                Q 640 715 625 710
                L 615 700
                L 620 685
                Q 630 670 625 655
                C 622 635 618 610 622 580
                L 612 620
                Q 615 670 618 720
                C 622 775 628 830 632 875
                L 630 895
                Q 625 910 615 915
                L 580 920
                Q 565 920 555 910
                L 545 895
                C 538 850 530 795 524 740
                L 520 700
                L 512 665
                L 504 700
                L 500 740
                C 494 795 486 850 479 895
                L 469 910
                Q 459 920 444 920
                L 409 915
                Q 399 910 394 895
                L 392 875
                C 396 830 402 775 406 720
                Q 409 670 412 620
                L 402 580
                C 406 610 402 635 399 655
                Q 394 670 404 685
                L 409 700
                L 399 710
                Q 384 715 374 705
                Q 364 695 369 680
                L 376 665
                L 369 650
                C 356 625 354 590 359 555
                C 366 505 386 448 409 420
                Q 436 390 480 380
                L 480 340
                Z"
                  fill="url(#bodyFill)" stroke="none"/>

            <!-- BODY STROKE masked -->
            <g mask="url(#bodyStrokeMask)">
                <path d="
                    M 480 340
                    Q 512 335 544 340
                    L 544 380
                    Q 588 390 615 420
                    C 638 448 658 505 665 555
                    C 670 590 668 625 655 650
                    L 648 665
                    L 655 680
                    Q 660 695 650 705
                    Q 640 715 625 710
                    L 615 700
                    L 620 685
                    Q 630 670 625 655
                    C 622 635 618 610 622 580
                    L 612 620
                    Q 615 670 618 720
                    C 622 775 628 830 632 875
                    L 630 895
                    Q 625 910 615 915
                    L 580 920
                    Q 565 920 555 910
                    L 545 895
                    C 538 850 530 795 524 740
                    L 520 700
                    L 512 665
                    L 504 700
                    L 500 740
                    C 494 795 486 850 479 895
                    L 469 910
                    Q 459 920 444 920
                    L 409 915
                    Q 399 910 394 895
                    L 392 875
                    C 396 830 402 775 406 720
                    Q 409 670 412 620
                    L 402 580
                    C 406 610 402 635 399 655
                    Q 394 670 404 685
                    L 409 700
                    L 399 710
                    Q 384 715 374 705
                    Q 364 695 369 680
                    L 376 665
                    L 369 650
                    C 356 625 354 590 359 555
                    C 366 505 386 448 409 420
                    Q 436 390 480 380
                    L 480 340
                    Z"
                      fill="none" stroke="#202038" stroke-width="12"
                      stroke-linejoin="round" stroke-linecap="round"/>
            </g>

            <!-- Armpit detail lines - higher -->
            <path d="M 402 530 Q 408 555 412 580"
                  fill="none" stroke="#202038" stroke-width="8"
                  stroke-linecap="round" opacity="0.5"/>
            <path d="M 622 530 Q 616 555 612 580"
                  fill="none" stroke="#202038" stroke-width="8"
                  stroke-linecap="round" opacity="0.5"/>

            <!-- HEAD -->
            <circle cx="512" cy="250" r="115"
                    fill="url(#bodyFill)" stroke="#202038" stroke-width="12"/>

            <!-- Head reflection -->
            <path d="M 545 155 A 85 85 0 0 1 600 210"
                  stroke="white" stroke-width="16" fill="none"
                  stroke-linecap="round" opacity="0.4"
                  clip-path="url(#headClip)"/>

            <!-- Eyes -->
            <ellipse cx="485" cy="255" rx="13" ry="16" fill="#202038"/>
            <ellipse cx="539" cy="255" rx="13" ry="16" fill="#202038"/>

            <!-- Eye highlights -->
            <circle cx="482" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>
            <circle cx="536" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>

        </g>
    </g>
</svg>
