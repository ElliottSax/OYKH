<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9a825"/>
      <stop offset="50%" style="stop-color:#29b6f6"/>
      <stop offset="100%" style="stop-color:#ab47bc"/>
    </linearGradient>

    <!-- Clip paths for cel-shading shadows -->
    <clipPath id="headClip">
      <ellipse cx="960" cy="420" rx="75" ry="75"/>
    </clipPath>
    <clipPath id="bodyClip">
      <ellipse cx="960" cy="580" rx="55" ry="85"/>
    </clipPath>
    <clipPath id="leftArmClip">
      <ellipse cx="820" cy="540" rx="70" ry="18"/>
    </clipPath>
    <clipPath id="rightArmClip">
      <ellipse cx="1100" cy="540" rx="70" ry="18"/>
    </clipPath>
    <clipPath id="leftLegClip">
      <ellipse cx="920" cy="750" rx="22" ry="80"/>
    </clipPath>
    <clipPath id="rightLegClip">
      <ellipse cx="1000" cy="750" rx="22" ry="80"/>
    </clipPath>
    <clipPath id="leftFootClip">
      <ellipse cx="920" cy="840" rx="28" ry="14"/>
    </clipPath>
    <clipPath id="rightFootClip">
      <ellipse cx="1000" cy="840" rx="28" ry="14"/>
    </clipPath>
    <clipPath id="leftHandClip">
      <circle cx="755" cy="540" r="18"/>
    </clipPath>
    <clipPath id="rightHandClip">
      <circle cx="1165" cy="540" r="18"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Ground shadow -->
  <ellipse cx="960" cy="870" rx="120" ry="25" fill="rgba(20,20,60,0.35)"/>

  <!-- CHARACTER - Draw order: back to front -->
  <g id="character">

    <!-- ========== LEFT LEG (separate, with own outline) ========== -->
    <g id="leftLeg">
      <!-- Base shape -->
      <ellipse cx="920" cy="750" rx="22" ry="80"
               fill="#FFFFFF" stroke="#1a2a4a" stroke-width="8"/>
      <!-- Cel shadow (right side, hard edge) -->
      <rect x="920" y="670" width="30" height="160"
            fill="#D8DCE8" clip-path="url(#leftLegClip)"/>
      <!-- Foot -->
      <ellipse cx="920" cy="840" rx="28" ry="14"
               fill="#FFFFFF" stroke="#1a2a4a" stroke-width="8"/>
      <rect x="920" y="826" width="35" height="28"
            fill="#D8DCE8" clip-path="url(#leftFootClip)"/>
    </g>

    <!-- ========== RIGHT LEG (separate, with own outline) ========== -->
    <g id="rightLeg">
      <!-- Base shape -->
      <ellipse cx="1000" cy="750" rx="22" ry="80"
               fill="#FFFFFF" stroke="#1a2a4a" stroke-width="8"/>
      <!-- Cel shadow -->
      <rect x="1000" y="670" width="30" height="160"
            fill="#D8DCE8" clip-path="url(#rightLegClip)"/>
      <!-- Foot -->
      <ellipse cx="1000" cy="840" rx="28" ry="14"
               fill="#FFFFFF" stroke="#1a2a4a" stroke-width="8"/>
      <rect x="1000" y="826" width="35" height="28"
            fill="#D8DCE8" clip-path="url(#rightFootClip)"/>
    </g>

    <!-- ========== BODY (torso) ========== -->
    <g id="body">
      <!-- Base shape -->
      <ellipse cx="960" cy="580" rx="55" ry="85"
               fill="#FFFFFF" stroke="#1a2a4a" stroke-width="8"/>
      <!-- Cel shadow (right side) -->
      <rect x="960" y="495" width="60" height="170"
            fill="#D8DCE8" clip-path="url(#bodyClip)"/>
    </g>

    <!-- ========== LEFT ARM (behind body, with full outline) ========== -->
    <g id="leftArm">
      <!-- Arm -->
      <ellipse cx="820" cy="540" rx="70" ry="18"
               fill="#FFFFFF" stroke="#1a2a4a" stroke-width="8"
               transform="rotate(-15 820 540)"/>
      <!-- Cel shadow -->
      <rect x="750" y="540" width="140" height="25"
            fill="#D8DCE8" clip-path="url(#leftArmClip)"
            transform="rotate(-15 820 540)"/>
      <!-- Hand -->
      <circle cx="755" cy="555" r="18"
              fill="#FFFFFF" stroke="#1a2a4a" stroke-width="8"/>
      <rect x="755" y="537" width="20" height="36"
            fill="#D8DCE8" clip-path="url(#leftHandClip)"/>
    </g>

    <!-- ========== RIGHT ARM (in front, FULL outline visible) ========== -->
    <g id="rightArm">
      <!-- Arm -->
      <ellipse cx="1100" cy="540" rx="70" ry="18"
               fill="#FFFFFF" stroke="#1a2a4a" stroke-width="8"
               transform="rotate(15 1100 540)"/>
      <!-- Cel shadow -->
      <rect x="1030" y="540" width="140" height="25"
            fill="#D8DCE8" clip-path="url(#rightArmClip)"
            transform="rotate(15 1100 540)"/>
      <!-- Hand -->
      <circle cx="1165" cy="555" r="18"
              fill="#FFFFFF" stroke="#1a2a4a" stroke-width="8"/>
      <rect x="1165" y="537" width="20" height="36"
            fill="#D8DCE8" clip-path="url(#rightHandClip)"/>
    </g>

    <!-- ========== HEAD ========== -->
    <g id="head">
      <!-- Base shape -->
      <ellipse cx="960" cy="420" rx="75" ry="75"
               fill="#FFFFFF" stroke="#1a2a4a" stroke-width="8"/>
      <!-- Cel shadow (right side, hard edge at center) -->
      <rect x="960" y="345" width="80" height="150"
            fill="#D8DCE8" clip-path="url(#headClip)"/>
      <!-- Highlight (top-left) -->
      <ellipse cx="925" cy="385" rx="22" ry="12"
               fill="#FFFFFF" opacity="0.7"
               transform="rotate(-20 925 385)"/>
      <!-- Eyes -->
      <ellipse cx="930" cy="430" rx="10" ry="14" fill="#1a2a4a"/>
      <ellipse cx="990" cy="430" rx="10" ry="14" fill="#1a2a4a"/>
    </g>

  </g>
</svg>
