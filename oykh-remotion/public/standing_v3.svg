<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="50%" style="stop-color:#2a2a5e"/>
      <stop offset="100%" style="stop-color:#3a3a7e"/>
    </linearGradient>

    <!-- Clip path for entire character (for shadows/highlights) -->
    <clipPath id="bodyClip">
      <!-- Combined head + torso shape -->
      <path d="M 960 345
               C 1040 345, 1050 400, 1050 450
               C 1050 500, 1040 520, 1025 550
               L 1030 620
               C 1030 670, 1000 690, 960 690
               C 920 690, 890 670, 890 620
               L 895 550
               C 880 520, 870 500, 870 450
               C 870 400, 880 345, 960 345
               Z"/>
    </clipPath>

    <clipPath id="headOnlyClip">
      <ellipse cx="960" cy="420" rx="70" ry="70"/>
    </clipPath>

    <clipPath id="leftLegClip">
      <path d="M 905 665
               Q 895 720, 900 780
               Q 905 830, 915 850
               L 945 850
               Q 950 830, 945 780
               Q 940 720, 935 665
               Z"/>
    </clipPath>

    <clipPath id="rightLegClip">
      <path d="M 985 665
               Q 980 720, 975 780
               Q 970 830, 975 850
               L 1005 850
               Q 1015 830, 1020 780
               Q 1025 720, 1015 665
               Z"/>
    </clipPath>

    <clipPath id="leftArmClip">
      <path d="M 870 530
               Q 820 520, 770 535
               Q 745 545, 740 555
               Q 745 575, 770 580
               Q 820 575, 870 565
               Z"/>
    </clipPath>

    <clipPath id="rightArmClip">
      <path d="M 1050 530
               Q 1100 520, 1150 535
               Q 1175 545, 1180 555
               Q 1175 575, 1150 580
               Q 1100 575, 1050 565
               Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Ground shadow -->
  <ellipse cx="960" cy="870" rx="100" ry="20" fill="rgba(10,10,30,0.4)"/>

  <!-- ================================================================ -->
  <!-- CHARACTER -->
  <!-- ================================================================ -->
  <g id="character">

    <!-- ==================== LEFT LEG ==================== -->
    <g id="leftLeg">
      <!-- Base shape -->
      <path d="M 905 665
               Q 895 720, 900 780
               Q 905 830, 915 850
               L 945 850
               Q 950 830, 945 780
               Q 940 720, 935 665
               Z"
            fill="#FFFFFF" stroke="#1a2a4a" stroke-width="6" stroke-linejoin="round"/>

      <!-- Shadow crescent (right side, follows leg curve) -->
      <path d="M 935 670
               Q 948 720, 945 780
               Q 943 820, 940 845
               L 930 845
               Q 938 800, 935 750
               Q 932 700, 928 670
               Z"
            fill="#D8DCE8" clip-path="url(#leftLegClip)"/>

      <!-- Highlight crescent (left side, top) -->
      <path d="M 908 680
               Q 900 700, 902 730
               L 912 725
               Q 915 705, 912 685
               Z"
            fill="#FFFFFF" opacity="0.6" clip-path="url(#leftLegClip)"/>

      <!-- Foot -->
      <ellipse cx="925" cy="855" rx="30" ry="12"
               fill="#FFFFFF" stroke="#1a2a4a" stroke-width="6"/>
      <!-- Foot shadow -->
      <path d="M 935 848 Q 955 855, 950 862 Q 935 865, 925 860 Z"
            fill="#D8DCE8"/>
      <!-- Foot highlight -->
      <ellipse cx="912" cy="850" rx="8" ry="4" fill="#FFFFFF" opacity="0.5"/>
    </g>

    <!-- ==================== RIGHT LEG ==================== -->
    <g id="rightLeg">
      <!-- Base shape -->
      <path d="M 985 665
               Q 980 720, 975 780
               Q 970 830, 975 850
               L 1005 850
               Q 1015 830, 1020 780
               Q 1025 720, 1015 665
               Z"
            fill="#FFFFFF" stroke="#1a2a4a" stroke-width="6" stroke-linejoin="round"/>

      <!-- Shadow crescent (right side) -->
      <path d="M 1010 670
               Q 1025 720, 1022 780
               Q 1018 820, 1010 845
               L 1000 845
               Q 1010 800, 1008 750
               Q 1005 700, 1002 670
               Z"
            fill="#D8DCE8" clip-path="url(#rightLegClip)"/>

      <!-- Highlight crescent -->
      <path d="M 982 680
               Q 975 700, 972 730
               L 985 725
               Q 988 705, 985 685
               Z"
            fill="#FFFFFF" opacity="0.6" clip-path="url(#rightLegClip)"/>

      <!-- Foot -->
      <ellipse cx="995" cy="855" rx="30" ry="12"
               fill="#FFFFFF" stroke="#1a2a4a" stroke-width="6"/>
      <!-- Foot shadow -->
      <path d="M 1005 848 Q 1025 855, 1020 862 Q 1005 865, 995 860 Z"
            fill="#D8DCE8"/>
      <!-- Foot highlight -->
      <ellipse cx="982" cy="850" rx="8" ry="4" fill="#FFFFFF" opacity="0.5"/>
    </g>

    <!-- ==================== BODY + HEAD (connected organic shape) ==================== -->
    <g id="bodyHead">
      <!-- Combined head + torso base shape -->
      <path d="M 960 345
               C 1040 345, 1050 400, 1050 450
               C 1050 500, 1040 520, 1025 550
               L 1030 620
               C 1030 670, 1000 690, 960 690
               C 920 690, 890 670, 890 620
               L 895 550
               C 880 520, 870 500, 870 450
               C 870 400, 880 345, 960 345
               Z"
            fill="#FFFFFF" stroke="#1a2a4a" stroke-width="6" stroke-linejoin="round"/>

      <!-- HEAD: Shadow crescent (right side of head) -->
      <path d="M 990 360
               Q 1035 380, 1040 430
               Q 1038 480, 1010 500
               L 995 485
               Q 1015 460, 1015 420
               Q 1010 385, 985 370
               Z"
            fill="#D8DCE8" clip-path="url(#bodyClip)"/>

      <!-- HEAD: Primary highlight crescent (top-left) -->
      <path d="M 920 365
               Q 895 380, 890 410
               Q 892 430, 905 445
               L 920 430
               Q 912 415, 915 395
               Q 920 378, 930 370
               Z"
            fill="#FFFFFF" opacity="0.7" clip-path="url(#bodyClip)"/>

      <!-- HEAD: Small secondary highlight spot -->
      <ellipse cx="905" cy="390" rx="12" ry="8"
               fill="#FFFFFF" opacity="0.5"
               transform="rotate(-30 905 390)"/>

      <!-- TORSO: Shadow crescent (right side of body) -->
      <path d="M 1015 560
               Q 1028 590, 1025 630
               Q 1018 665, 990 685
               L 975 670
               Q 1000 655, 1005 625
               Q 1010 595, 1002 565
               Z"
            fill="#D8DCE8" clip-path="url(#bodyClip)"/>

      <!-- TORSO: Highlight crescent (left side) -->
      <path d="M 905 560
               Q 895 590, 898 620
               L 915 615
               Q 912 590, 918 565
               Z"
            fill="#FFFFFF" opacity="0.5" clip-path="url(#bodyClip)"/>

      <!-- Eyes -->
      <ellipse cx="935" cy="440" rx="10" ry="14" fill="#1a2a4a"/>
      <ellipse cx="985" cy="440" rx="10" ry="14" fill="#1a2a4a"/>

      <!-- Eye highlights (tiny white dots) -->
      <circle cx="932" cy="436" r="3" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="982" cy="436" r="3" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- ==================== LEFT ARM (with full outline) ==================== -->
    <g id="leftArm">
      <!-- Arm shape -->
      <path d="M 870 530
               Q 820 520, 770 535
               Q 745 545, 740 555
               Q 745 575, 770 580
               Q 820 575, 870 565
               Z"
            fill="#FFFFFF" stroke="#1a2a4a" stroke-width="6" stroke-linejoin="round"/>

      <!-- Shadow crescent (bottom of arm) -->
      <path d="M 860 560
               Q 810 568, 765 572
               Q 750 570, 752 565
               Q 755 558, 770 555
               Q 815 552, 858 548
               Z"
            fill="#D8DCE8" clip-path="url(#leftArmClip)"/>

      <!-- Highlight crescent (top of arm) -->
      <path d="M 855 535
               Q 810 530, 775 538
               L 780 548
               Q 815 542, 855 545
               Z"
            fill="#FFFFFF" opacity="0.5" clip-path="url(#leftArmClip)"/>

      <!-- Hand -->
      <circle cx="740" cy="560" r="22"
              fill="#FFFFFF" stroke="#1a2a4a" stroke-width="6"/>
      <!-- Hand shadow crescent -->
      <path d="M 748 545 Q 762 555, 758 575 Q 750 580, 742 575 Q 738 560, 745 548 Z"
            fill="#D8DCE8"/>
      <!-- Hand highlight -->
      <ellipse cx="730" cy="550" rx="7" ry="5" fill="#FFFFFF" opacity="0.6"
               transform="rotate(-20 730 550)"/>
    </g>

    <!-- ==================== RIGHT ARM (in front, full outline visible) ==================== -->
    <g id="rightArm">
      <!-- Arm shape -->
      <path d="M 1050 530
               Q 1100 520, 1150 535
               Q 1175 545, 1180 555
               Q 1175 575, 1150 580
               Q 1100 575, 1050 565
               Z"
            fill="#FFFFFF" stroke="#1a2a4a" stroke-width="6" stroke-linejoin="round"/>

      <!-- Shadow crescent (bottom of arm) -->
      <path d="M 1060 560
               Q 1110 568, 1155 572
               Q 1170 570, 1168 565
               Q 1165 558, 1150 555
               Q 1105 552, 1062 548
               Z"
            fill="#D8DCE8" clip-path="url(#rightArmClip)"/>

      <!-- Highlight crescent (top of arm) -->
      <path d="M 1065 535
               Q 1110 530, 1145 538
               L 1140 548
               Q 1105 542, 1065 545
               Z"
            fill="#FFFFFF" opacity="0.5" clip-path="url(#rightArmClip)"/>

      <!-- Hand -->
      <circle cx="1180" cy="560" r="22"
              fill="#FFFFFF" stroke="#1a2a4a" stroke-width="6"/>
      <!-- Hand shadow crescent -->
      <path d="M 1188 545 Q 1202 555, 1198 575 Q 1190 580, 1182 575 Q 1178 560, 1185 548 Z"
            fill="#D8DCE8"/>
      <!-- Hand highlight -->
      <ellipse cx="1170" cy="550" rx="7" ry="5" fill="#FFFFFF" opacity="0.6"
               transform="rotate(20 1170 550)"/>
    </g>

  </g>
</svg>
