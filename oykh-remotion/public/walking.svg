<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- Walking pose - v51 style with matched arm thickness -->

    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <g transform="translate(420, 0) scale(1.0546875)">

        <defs>
            <radialGradient id="bodyFill" cx="50%" cy="25%" r="75%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="50%" stop-color="#F5F5FA"/>
                <stop offset="100%" stop-color="#E8E8F0"/>
            </radialGradient>

            <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
                <feOffset dx="6" dy="10" result="shadow"/>
                <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
                <feComposite in2="shadow" operator="in"/>
                <feMerge>
                    <feMergeNode/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <clipPath id="headClip">
                <circle cx="512" cy="250" r="115"/>
            </clipPath>
        </defs>

        <!-- Ground Shadow -->
        <ellipse cx="520" cy="940" rx="160" ry="22" fill="rgba(30, 30, 50, 0.5)"/>

        <g filter="url(#dropShadow)">

            <!-- WALKING POSE - legs apart, arms swinging, matched thickness -->
            <path d="
                M 482 365
                Q 512 355 542 365
                L 542 380
                Q 585 388 630 405
                C 650 420 670 470 678 530
                Q 684 570 682 605
                Q 680 635 670 650
                Q 658 668 638 665
                Q 618 660 612 635
                Q 608 610 612 580
                C 616 550 618 520 615 495
                L 610 480
                Q 595 550 600 640
                C 605 700 615 760 630 820
                L 650 880
                Q 665 915 650 930
                L 600 935
                Q 575 930 560 895
                L 535 825
                C 520 770 512 715 510 660
                L 508 620
                L 502 660
                C 495 715 480 775 455 835
                L 420 895
                Q 395 930 375 930
                L 335 925
                Q 325 905 345 870
                L 390 800
                C 420 745 440 690 450 635
                Q 458 570 445 490
                L 438 505
                C 432 535 428 570 432 605
                Q 436 635 432 660
                Q 426 685 406 690
                Q 386 693 374 675
                Q 364 660 362 630
                Q 360 595 366 555
                C 376 490 404 425 424 405
                Q 455 388 482 380
                L 482 365
                Z"
                  fill="url(#bodyFill)" stroke="#202038" stroke-width="12"
                  stroke-linejoin="round" stroke-linecap="round"/>

            <!-- HEAD -->
            <circle cx="512" cy="250" r="115"
                    fill="url(#bodyFill)" stroke="#202038" stroke-width="12"/>

            <!-- Head reflection -->
            <path d="M 535 155 A 85 85 0 0 1 590 210"
                  stroke="#D0D0D8" stroke-width="16" fill="none"
                  stroke-linecap="round" opacity="0.5"
                  clip-path="url(#headClip)"/>

            <!-- Eyes -->
            <ellipse cx="485" cy="255" rx="13" ry="16" fill="#202038"/>
            <ellipse cx="539" cy="255" rx="13" ry="16" fill="#202038"/>

            <!-- Eye highlights -->
            <circle cx="482" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>
            <circle cx="536" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>

        </g>
    </g>
</svg>
