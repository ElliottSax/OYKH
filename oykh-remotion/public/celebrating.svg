<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- Celebrating pose - both arms up, ~68px thick like standing -->

    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <g transform="translate(420, 0) scale(1.0546875)">

        <defs>
            <radialGradient id="bodyFill" cx="50%" cy="25%" r="75%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="50%" stop-color="#F5F5FA"/>
                <stop offset="100%" stop-color="#E8E8F0"/>
            </radialGradient>

            <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
                <feOffset dx="6" dy="10" result="shadow"/>
                <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
                <feComposite in2="shadow" operator="in"/>
                <feMerge>
                    <feMergeNode/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <clipPath id="headClip">
                <circle cx="512" cy="250" r="115"/>
            </clipPath>
        </defs>

        <!-- Ground Shadow -->
        <ellipse cx="512" cy="940" rx="180" ry="25" fill="rgba(30, 30, 50, 0.5)"/>

        <g filter="url(#dropShadow)">

            <!-- CELEBRATING - Both arms raised up, ~68px thick -->
            <path d="
                M 482 365
                Q 512 355 542 365
                L 542 380
                Q 580 372 625 340
                C 670 305 710 260 745 215
                Q 765 188 785 195
                Q 802 210 792 240
                Q 770 290 730 345
                C 690 402 645 450 608 480
                Q 590 498 592 520
                L 595 540
                Q 600 620 605 710
                C 610 770 618 835 628 885
                Q 638 920 622 935
                L 569 940
                Q 544 935 539 910
                C 529 860 522 800 518 740
                L 516 710
                L 514 740
                C 510 800 503 860 493 910
                Q 488 935 463 940
                L 410 935
                Q 394 920 404 885
                C 414 835 422 770 428 710
                Q 432 620 437 540
                L 440 520
                Q 442 498 424 480
                C 387 450 342 402 302 345
                Q 262 290 240 240
                Q 230 210 247 195
                Q 267 188 287 215
                C 322 260 362 305 407 340
                Q 452 372 482 380
                L 482 365
                Z"
                  fill="url(#bodyFill)" stroke="#202038" stroke-width="12"
                  stroke-linejoin="round" stroke-linecap="round"/>

            <!-- HEAD -->
            <circle cx="512" cy="250" r="115"
                    fill="url(#bodyFill)" stroke="#202038" stroke-width="12"/>

            <!-- Head reflection -->
            <path d="M 535 155 A 85 85 0 0 1 590 210"
                  stroke="#D0D0D8" stroke-width="16" fill="none"
                  stroke-linecap="round" opacity="0.5"
                  clip-path="url(#headClip)"/>

            <!-- Eyes - happy squint -->
            <path d="M 472 255 Q 485 248 498 255" stroke="#202038" stroke-width="8" fill="none" stroke-linecap="round"/>
            <path d="M 526 255 Q 539 248 552 255" stroke="#202038" stroke-width="8" fill="none" stroke-linecap="round"/>

        </g>
    </g>
</svg>
