<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- v41: Fixes from v40
         - REMOVED gray crotch line on upper legs
         - Body extends UP to overlap head (no gap at neck)
         - Ken doll hands (contoured, suggesting fingers)
         - Shoe-shaped feet (from v30)
         - Arms same thickness as legs -->

    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <g transform="translate(420, 0) scale(1.0546875)">

        <defs>
            <radialGradient id="bodyFill" cx="50%" cy="25%" r="75%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="50%" stop-color="#F5F5FA"/>
                <stop offset="100%" stop-color="#E8E8F0"/>
            </radialGradient>

            <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
                <feOffset dx="6" dy="10" result="shadow"/>
                <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
                <feComposite in2="shadow" operator="in"/>
                <feMerge>
                    <feMergeNode/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <clipPath id="headClip">
                <circle cx="512" cy="250" r="115"/>
            </clipPath>
        </defs>

        <!-- Ground Shadow -->
        <ellipse cx="512" cy="945" rx="180" ry="25" fill="rgba(30, 30, 50, 0.5)"/>

        <g filter="url(#dropShadow)">

            <!-- BODY - extends up to y=320 to overlap with head (head center at 250, radius 115, bottom at 365) -->
            <path d="
                M 485 320
                Q 512 315 539 320
                L 539 380
                Q 585 388 615 415
                C 642 440 668 510 675 565
                Q 682 610 668 640
                Q 655 665 635 670
                Q 612 672 600 655
                C 590 635 592 600 598 565
                L 590 610
                Q 595 660 600 710
                C 605 765 612 820 618 865
                L 625 895
                Q 630 915 610 925
                L 565 930
                Q 545 928 540 910
                L 535 880
                C 525 830 518 775 514 720
                L 512 690
                L 510 720
                C 506 775 499 830 489 880
                L 484 910
                Q 479 928 459 930
                L 414 925
                Q 394 915 399 895
                L 406 865
                C 412 820 419 765 424 710
                Q 429 660 434 610
                L 426 565
                C 432 600 434 635 424 655
                Q 412 672 389 670
                Q 369 665 356 640
                Q 342 610 349 565
                C 356 510 382 440 409 415
                Q 439 388 485 380
                L 485 320
                Z"
                  fill="url(#bodyFill)" stroke="#202038" stroke-width="12"
                  stroke-linejoin="round" stroke-linecap="round"/>

            <!-- Internal armpit detail lines only -->
            <path d="M 426 565 Q 432 590 434 615"
                  fill="none" stroke="#202038" stroke-width="8"
                  stroke-linecap="round" opacity="0.5"/>
            <path d="M 598 565 Q 592 590 590 615"
                  fill="none" stroke="#202038" stroke-width="8"
                  stroke-linecap="round" opacity="0.5"/>

            <!-- HEAD - drawn on top, overlapping body -->
            <circle cx="512" cy="250" r="115"
                    fill="url(#bodyFill)" stroke="#202038" stroke-width="12"/>

            <!-- Head reflection -->
            <path d="M 545 155 A 85 85 0 0 1 600 210"
                  stroke="white" stroke-width="16" fill="none"
                  stroke-linecap="round" opacity="0.4"
                  clip-path="url(#headClip)"/>

            <!-- Eyes -->
            <ellipse cx="485" cy="255" rx="13" ry="16" fill="#202038"/>
            <ellipse cx="539" cy="255" rx="13" ry="16" fill="#202038"/>

            <!-- Eye highlights -->
            <circle cx="482" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>
            <circle cx="536" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>

        </g>
    </g>
</svg>
