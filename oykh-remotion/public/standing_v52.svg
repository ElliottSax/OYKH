<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- v52: Based on v51
         - Arms ~20px thicker
         - Pointier Ken doll hands -->

    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45b8d1"/>
            <stop offset="30%" stop-color="#6a6acd"/>
            <stop offset="60%" stop-color="#c080a8"/>
            <stop offset="100%" stop-color="#e8a060"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <g transform="translate(420, 0) scale(1.0546875)">

        <defs>
            <radialGradient id="bodyFill" cx="50%" cy="25%" r="75%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="50%" stop-color="#F5F5FA"/>
                <stop offset="100%" stop-color="#E8E8F0"/>
            </radialGradient>

            <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
                <feOffset dx="6" dy="10" result="shadow"/>
                <feFlood flood-color="#1a1a2e" flood-opacity="0.35"/>
                <feComposite in2="shadow" operator="in"/>
                <feMerge>
                    <feMergeNode/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <clipPath id="headClip">
                <circle cx="512" cy="250" r="115"/>
            </clipPath>
        </defs>

        <!-- Ground Shadow -->
        <ellipse cx="512" cy="940" rx="180" ry="25" fill="rgba(30, 30, 50, 0.5)"/>

        <g filter="url(#dropShadow)">

            <!-- CHALK OUTLINE - thicker arms with pointy Ken doll hands -->
            <path d="
                M 482 365
                Q 512 355 542 365
                L 542 380
                Q 585 388 635 405
                C 660 420 695 490 705 560
                Q 712 600 710 640
                Q 708 670 695 690
                L 672 695
                Q 648 685 640 655
                Q 635 625 638 590
                C 642 555 640 520 632 500
                L 620 490
                Q 595 590 600 700
                C 605 760 614 825 624 875
                Q 634 910 618 925
                L 565 930
                Q 540 925 535 900
                C 525 850 518 790 514 730
                L 512 700
                L 510 730
                C 506 790 499 850 489 900
                Q 484 925 459 930
                L 406 925
                Q 390 910 400 875
                C 410 825 419 760 426 700
                Q 429 590 404 490
                L 392 500
                C 384 520 382 555 386 590
                Q 389 625 384 655
                Q 376 685 352 695
                L 329 690
                Q 316 670 314 640
                Q 312 600 319 560
                C 329 490 364 420 389 405
                Q 439 388 482 380
                L 482 365
                Z"
                  fill="url(#bodyFill)" stroke="#202038" stroke-width="12"
                  stroke-linejoin="round" stroke-linecap="round"/>

            <!-- HEAD -->
            <circle cx="512" cy="250" r="115"
                    fill="url(#bodyFill)" stroke="#202038" stroke-width="12"/>

            <!-- Head reflection - LIGHT GRAY -->
            <path d="M 535 155 A 85 85 0 0 1 590 210"
                  stroke="#D0D0D8" stroke-width="16" fill="none"
                  stroke-linecap="round" opacity="0.5"
                  clip-path="url(#headClip)"/>

            <!-- Eyes -->
            <ellipse cx="485" cy="255" rx="13" ry="16" fill="#202038"/>
            <ellipse cx="539" cy="255" rx="13" ry="16" fill="#202038"/>

            <!-- Eye highlights -->
            <circle cx="482" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>
            <circle cx="536" cy="250" r="4" fill="#FFFFFF" opacity="0.95"/>

        </g>
    </g>
</svg>
