<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9a825"/>
      <stop offset="50%" style="stop-color:#29b6f6"/>
      <stop offset="100%" style="stop-color:#ab47bc"/>
    </linearGradient>

    <!-- Clip for body+head -->
    <clipPath id="bodyHeadClip">
      <path d="M 960 377.5 C 1073.75 377.5 1073.75 526.25 1027.5 590 L 1030 640 Q 1030 677.5 960 677.5 Q 890 677.5 890 640 L 892.5 590 C 846.25 526.25 846.25 377.5 960 377.5 Z"/>
    </clipPath>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <ellipse cx="960" cy="852.5" rx="150" ry="37.5" fill="rgba(20,20,60,0.3)"/>

  <g id="character">
    <!-- Legs -->
    <path d="M 946.44 646.51 Q 921.29 582.51 896.13 518.50 L 869.82 528.08 Q 891.69 593.28 913.56 658.49 Z" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10" stroke-linejoin="round"/>
    <ellipse cx="882.97" cy="523.29" rx="18.2" ry="15.4" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10"/>
    <path d="M 1006.44 658.49 Q 1028.31 593.28 1050.18 528.08 L 1023.87 518.50 Q 998.71 582.51 973.56 646.51 Z" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10" stroke-linejoin="round"/>
    <ellipse cx="1037.03" cy="523.29" rx="18.2" ry="15.4" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10"/>

    <!-- Body + Head base -->
    <path d="M 960 377.5 C 1073.75 377.5 1073.75 526.25 1027.5 590 L 1030 640 Q 1030 677.5 960 677.5 Q 890 677.5 890 640 L 892.5 590 C 846.25 526.25 846.25 377.5 960 377.5 Z" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10" stroke-linejoin="round"/>

    <!-- CEL SHADING - Crescents via overlapping ellipses -->
    <g id="shading" clip-path="url(#bodyHeadClip)">
      <!-- Head shadow crescent -->
      <ellipse cx="1000" cy="440" rx="65" ry="75" fill="#D8DCE8"/>
      <ellipse cx="970" cy="440" rx="60" ry="70" fill="#FFFFFF"/>

      <!-- Head highlight crescent -->
      <ellipse cx="920" cy="405" rx="30" ry="35" fill="#FFFFFF" opacity="0.7"/>
      <ellipse cx="932" cy="418" rx="28" ry="33" fill="#FFFFFF" opacity="0"/>

      <!-- Small specular highlight -->
      <ellipse cx="915" cy="400" rx="12" ry="7" fill="#FFFFFF" opacity="0.8" transform="rotate(-25 915 400)"/>

      <!-- Torso shadow -->
      <ellipse cx="1005" cy="630" rx="45" ry="50" fill="#D8DCE8"/>
      <ellipse cx="985" cy="630" rx="40" ry="45" fill="#FFFFFF"/>

      <!-- Torso highlight -->
      <ellipse cx="910" cy="615" rx="15" ry="25" fill="#FFFFFF" opacity="0.5"/>
    </g>

    <!-- Eyes -->
    <ellipse cx="930" cy="460" rx="12.5" ry="15" fill="#1a1a3e"/>
    <ellipse cx="990" cy="460" rx="12.5" ry="15" fill="#1a1a3e"/>
    <circle cx="926" cy="455" r="4" fill="#FFFFFF"/>
    <circle cx="986" cy="455" r="4" fill="#FFFFFF"/>

    <!-- Arms -->
    <path d="M 905.13 563.40 Q 851.25 546.99 797.88 529.16 L 790.69 548.89 Q 843.04 569.54 894.87 591.60 Z" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10" stroke-linejoin="round"/>
    <ellipse cx="794.28" cy="539.02" rx="12.6" ry="12.6" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10"/>
    <path d="M 1025.13 591.60 Q 1076.96 569.54 1129.31 548.89 L 1122.12 529.16 Q 1068.75 546.99 1014.87 563.40 Z" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10" stroke-linejoin="round"/>
    <ellipse cx="1125.72" cy="539.02" rx="12.6" ry="12.6" fill="#FFFFFF" stroke="#1a1a3e" stroke-width="10"/>
  </g>
</svg>